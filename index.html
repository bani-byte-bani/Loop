<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOP CONSOLE</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c9862f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#c9c2b0;
    --body-a:#f2eee2;
    --body-b:#ddd6c4;
    --panel:#eae4d6;
    --shell-edge:#b8b09c;
    --ink:#2b2820;
    --ink-dim:#8a8271;
    --ink-faint:#b3ab98;
    --line:#c1b9a6;
    --screen-bg:#12140f;
    --screen-fg:#6fc7ff;
    --red:#c23b2e;
    --green:#3f8f5f;
    --pink:#c2588f;
    --blue:#3e6bcf;
    --amber:#c9862f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% -20%, #d8d1bf 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 14px 80px;
  }
  .console{
    width:100%;
    max-width:860px;
    background:linear-gradient(160deg, var(--body-a) 0%, var(--body-b) 100%);
    border:1px solid var(--shell-edge);
    border-radius:20px;
    padding:20px;
    box-shadow:0 30px 60px -24px rgba(30,25,15,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .brand{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; }
  .brand-sub{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.18em; color:var(--ink-dim); margin-top:2px; }
  .brand-right{ display:flex; align-items:center; gap:10px; }
  .sync-mode-badge{ font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:0.1em; color:var(--ink-dim); background:#f4f0e5; border:1px solid var(--line); border-radius:4px; padding:2px 6px; }
  .led-mini{ width:7px;height:7px;border-radius:50%; background:var(--red); opacity:0.25; transition:opacity .15s, box-shadow .15s; }
  .led-mini.on{ opacity:1; box-shadow:0 0 6px var(--red); }
  .learn-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.1em;
    padding:6px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#f4f0e5;
    color:var(--ink-dim);
    cursor:pointer;
  }
  .learn-toggle.on{
    background:var(--amber);
    color:#2a1a06;
    border-color:var(--amber);
    animation:learnpulse 1s ease-in-out infinite;
  }
  @keyframes learnpulse{ 50%{ opacity:0.7; } }
  .panic-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.12em;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--red);
    background:#f7e2df;
    color:var(--red);
    cursor:pointer;
    font-weight:700;
  }
  .panic-btn:active{ background:var(--red); color:#fff; }
  .fullscreen-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.1em;
    padding:6px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#f4f0e5;
    color:var(--ink-dim);
    cursor:pointer;
  }
  .fullscreen-btn.on{
    background:var(--ink);
    color:var(--body-a);
    border-color:var(--ink);
  }
  .learn-status{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:#8a5a1c;
    background:#f7ecd8;
    border:1px solid var(--amber);
    border-radius:6px;
    padding:6px 10px;
    margin-bottom:10px;
  }
  .hairline{ height:1px; background:linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent); margin:14px 0; }
  .hidden{ display:none !important; }

  /* setup */
  .setup label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; }
  .setup select, .setup input[type="number"]{ width:100%; padding:10px; margin-bottom:12px; background:#f7f4ec; color:var(--ink); border:1px solid var(--line); border-radius:8px; font-family:'Noto Sans JP', sans-serif; font-size:13px; }
  .mode-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .mode-toggle button{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:#f7f4ec; color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.04em; cursor:pointer; }
  .mode-toggle button.active{ background:var(--ink); color:var(--body-a); border-color:var(--ink); }
  .btn-slab{ width:100%; cursor:pointer; padding:14px; border-radius:10px; border:1px solid var(--shell-edge); background:linear-gradient(180deg,#f7f4ec,#e6e0cf); color:var(--ink); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; box-shadow:0 2px 0 rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7); }
  .btn-slab:active{ transform:translateY(1px); }
  .error{ color:var(--red); font-size:11px; margin-top:10px; font-family:'JetBrains Mono', monospace; }

  /* main grid */
  .main-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:720px){ .main-grid{ grid-template-columns:1.15fr 1fr; } }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h2{ margin:0 0 12px; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.16em; color:var(--ink-dim); text-transform:uppercase; }
  .card.collapsible{ padding:16px; }
  .card.collapsible summary{
    margin:0; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.16em;
    color:var(--ink-dim); text-transform:uppercase; cursor:pointer; list-style:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  .card.collapsible summary::-webkit-details-marker{ display:none; }
  .card.collapsible summary::after{ content:'▸'; font-size:10px; transition:transform .15s ease; }
  .card.collapsible[open] summary::after{ transform:rotate(90deg); }
  .card.collapsible[open] summary{ margin-bottom:12px; }
  .card.collapsible[open] > *:not(summary){ margin-top:0; }

  .lcd{ background:var(--screen-bg); border-radius:6px; padding:9px 13px; display:flex; align-items:baseline; justify-content:space-between; box-shadow:inset 0 2px 6px rgba(0,0,0,0.6); margin-bottom:16px; }
  .lcd-time{ font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--screen-fg); letter-spacing:0.05em; text-shadow:0 0 8px rgba(111,199,255,0.5); font-variant-numeric:tabular-nums; }
  .lcd-tag{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--screen-fg); opacity:0.7; letter-spacing:0.14em; }

  .dial-wrap{ position:relative; width:210px; height:210px; margin:4px auto 6px; }
  .dial-svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .dial-face{ fill:#efe9db; stroke:var(--line); stroke-width:1; }
  .dial-progress{ fill:none; stroke:var(--ink-dim); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset .05s linear, stroke .2s ease; }
  .dial-progress.rec{ stroke:var(--red); }
  .dial-progress.play{ stroke:var(--green); }
  .dial-progress.armed{ stroke:var(--amber); }
  .tick{ stroke:var(--ink-dim); stroke-width:1; opacity:0.5; }
  .tick.bar-start{ stroke:var(--ink); stroke-width:1.6; opacity:0.85; }
  .dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .dial-track-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); letter-spacing:0.1em; margin-bottom:4px; }
  .dial-bpm{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:30px; line-height:1; }
  .dial-bpm-edit{ display:flex; align-items:center; gap:6px; pointer-events:auto; }
  .bpm-step{ pointer-events:auto; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:#f4f0e5; color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-size:14px; cursor:pointer; line-height:1; }
  .bpm-input{ width:70px; text-align:center; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:26px; border:none; border-bottom:1px dashed var(--line); background:transparent; color:var(--ink); pointer-events:auto; }
  .bpm-input::-webkit-outer-spin-button, .bpm-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .dial-bpm-unit{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.2em; margin-top:3px; }
  .tap-btn{ pointer-events:auto; margin-top:6px; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.12em; padding:4px 12px; border-radius:12px; border:1px solid var(--line); background:#f4f0e5; color:var(--ink-dim); cursor:pointer; }
  .tap-btn:active{ background:var(--amber); color:#2a1a06; }
  .dial-pos{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); margin-top:7px; }

  .bars-row{ display:flex; gap:6px; justify-content:center; margin:12px 0 4px; }
  .bars-row button{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#f4f0e5; color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; cursor:pointer; }
  .bars-row button.active{ background:var(--ink); color:var(--body-a); border-color:var(--ink); }
  .bars-row button:disabled{ opacity:0.4; cursor:not-allowed; }
  .bars-caption{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.14em; margin-bottom:14px; }

  .state-line{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); margin-bottom:12px; min-height:14px; }

  .transport{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .deck-btn{ position:relative; aspect-ratio:1; border-radius:12px; border:1px solid var(--shell-edge); background:linear-gradient(180deg,#f7f4ec,#e2dbc8); box-shadow:0 2px 0 rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.7); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .deck-btn:active{ transform:translateY(1px); }
  .deck-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .deck-glyph{ width:19px; height:19px; }
  .deck-glyph svg{ width:100%; height:100%; }
  .deck-label{ position:absolute; bottom:5px; font-family:'JetBrains Mono', monospace; font-size:7px; letter-spacing:0.1em; color:var(--ink-dim); }
  #btnRec .deck-glyph circle{ fill:var(--red); }
  #btnRec.armed{ animation:blinkbg 0.6s step-start infinite; }
  #btnRec.recording{ background:linear-gradient(180deg,#f3d9d5,#e8c2bc); }
  @keyframes blinkbg{ 50%{ background:linear-gradient(180deg,#f3d9d5,#e8c2bc); } }
  #btnPlay .deck-glyph polygon{ fill:var(--ink); }
  #btnPlay.armed{ animation:blinkbg2 0.6s step-start infinite; }
  #btnPlay.playing{ background:linear-gradient(180deg,#d9ecdf,#c3ddc9); }
  #btnPlay.playing .deck-glyph polygon{ fill:var(--green); }
  @keyframes blinkbg2{ 50%{ background:linear-gradient(180deg,#d9ecdf,#c3ddc9); } }
  #btnStop .deck-glyph rect{ fill:var(--ink); }
  #btnStop.armed{ animation:blinkbg3 0.6s step-start infinite; }
  @keyframes blinkbg3{ 50%{ background:linear-gradient(180deg,#f7ecd8,#f0dcb0); } }
  #btnClear .deck-glyph line{ stroke:var(--ink); }

  .reset-row{ text-align:center; margin-top:12px; }
  .reset-row button{ background:none; border:none; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); text-decoration:underline; }

  /* track select */
  .track-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .track-row:last-child{ border-bottom:none; }
  .track-radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-faint); flex:none; position:relative; }
  .track-row.selected .track-radio{ border-color:var(--blue); }
  .track-row.selected .track-radio::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--blue); }
  .track-letter{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; width:20px; flex:none; }
  .track-body{ flex:1; min-width:0; }
  .track-mini-bars{ display:flex; gap:2px; height:16px; align-items:flex-end; margin-bottom:5px; }
  .track-mini-bars span{ flex:1; background:var(--ink-faint); border-radius:1px; min-height:3px; }
  .track-mini-bars span.filled{ background:var(--ink-dim); }
  .track-meta{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); }
  .track-state-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .track-state-dot.rec{ background:var(--red); box-shadow:0 0 5px var(--red); }
  .track-state-dot.play{ background:var(--green); box-shadow:0 0 5px var(--green); }
  .track-state-dot.armed{ background:var(--amber); box-shadow:0 0 5px var(--amber); }

  /* effects */
  .effects-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .fx-cell{ display:flex; flex-direction:column; gap:6px; }
  .fx-toggle{ background:#f4f0e5; border:1px solid var(--line); border-radius:10px; padding:12px 4px 8px; cursor:pointer; text-align:center; position:relative; width:100%; }
  .fx-toggle .fx-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin:0 auto 6px; }
  .fx-toggle.on .fx-dot{ background:var(--amber); box-shadow:0 0 6px var(--amber); }
  .fx-toggle.on{ background:#f7eede; border-color:var(--amber); }
  .fx-toggle.pending{ animation:fxpendingpulse 0.6s ease-in-out infinite; }
  @keyframes fxpendingpulse{ 50%{ box-shadow:0 0 0 2px var(--amber) inset; } }
  .fx-amount{ width:100%; height:14px; accent-color:var(--amber); cursor:pointer; }
  .fx-amount-spacer{ height:14px; }
  .fx-icon{ width:22px; height:22px; margin:0 auto 6px; }
  .fx-icon svg{ width:100%; height:100%; stroke:var(--ink); fill:none; stroke-width:1.6; }
  .fx-label{ font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:0.08em; color:var(--ink-dim); }
  .fx-caption{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.1em; margin-top:10px; }

  /* timeline */
  .timeline-wrap{ position:relative; height:90px; background:#f4f0e5; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .timeline-wrap canvas{ width:100%; height:100%; display:block; }
  .playhead{ position:absolute; top:0; bottom:0; width:1px; background:var(--red); left:0; }
  .timeline-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.1em; }

  /* midi mappings */
  .mapping-row{ display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:11px; }
  .mapping-row:last-child{ border-bottom:none; }
  .mapping-trigger{ color:var(--ink); background:#f4f0e5; border:1px solid var(--line); border-radius:6px; padding:2px 6px; white-space:nowrap; }
  .mapping-arrow{ color:var(--ink-faint); }
  .mapping-action{ flex:1; color:var(--ink-dim); }
  .mapping-remove{ background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; line-height:1; padding:2px 6px; }
  .mapping-empty{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); line-height:1.6; }

  .footer{ margin-top:16px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; color:var(--ink-faint); }
</style>
</head>
<body>
<div class="console">
  <div class="brand-row">
    <div>
      <div class="brand">LOOP CONSOLE</div>
      <div class="brand-sub">4-TRACK / MIDI CLOCK SYNC</div>
    </div>
    <div class="brand-right">
      <span class="sync-mode-badge hidden" id="syncModeBadge">EXT</span>
      <button class="panic-btn" id="btnPanic">PANIC</button>
      <button class="learn-toggle" id="btnKeyLearn">KEY LEARN</button>
      <button class="learn-toggle" id="btnMidiLearn">MIDI LEARN</button>
      <button class="fullscreen-btn" id="btnFullscreen">⛶ FULLSCREEN</button>
      <span class="led-mini" id="syncLed"></span>
    </div>
  </div>
  <div class="learn-status hidden" id="learnStatus"></div>

  <div class="hairline"></div>

  <div class="setup" id="setupPanel">
    <label>同期モード</label>
    <div class="mode-toggle" id="syncModeToggle">
      <button data-mode="external" class="active">外部クロック(Circuit等)</button>
      <button data-mode="standalone">スタンドアロン(内部クロック)</button>
    </div>

    <div class="hidden" id="bpmSetupRow">
      <label for="bpmSetupInput">BPM(スタンドアロン時のテンポ)</label>
      <input type="number" id="bpmSetupInput" min="20" max="300" value="120">
    </div>

    <label for="midiSelect" id="midiSelectLabel">MIDI入力(クロックのマスター)</label>
    <select id="midiSelect" disabled><option>権限を許可してください</option></select>

    <label for="audioInSelect">オーディオ入力</label>
    <select id="audioInSelect" disabled><option>権限を許可してください</option></select>
    <label for="audioOutSelect">オーディオ出力</label>
    <select id="audioOutSelect" disabled><option>権限を許可してください</option></select>
    <div style="height:6px;"></div>
    <button class="btn-slab" id="btnGrant">デバイスへのアクセスを許可</button>
    <button class="btn-slab hidden" id="btnConnect" style="margin-top:10px;">この設定で接続する</button>
    <div class="error hidden" id="errorLine"></div>
  </div>

  <div class="hidden" id="performPanel">
    <div class="main-grid">
      <div class="card">
        <div class="lcd">
          <span class="lcd-time" id="lcdTime">0:00:00</span>
          <span class="lcd-tag" id="lcdTag">READY</span>
        </div>
        <div class="dial-wrap">
          <svg class="dial-svg" viewBox="0 0 100 100">
            <circle class="dial-face" cx="50" cy="50" r="46"></circle>
            <line class="dial-cross" x1="50" y1="6" x2="50" y2="14" stroke="var(--line)"></line>
            <line class="dial-cross" x1="50" y1="86" x2="50" y2="94" stroke="var(--line)"></line>
            <g id="dialTicks"></g>
            <circle id="dialProgress" class="dial-progress" cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
          </svg>
          <div class="dial-center">
            <div class="dial-track-label" id="dialTrackLabel">TRACK A</div>
            <div class="dial-bpm" id="bpmNum">---</div>
            <div class="dial-bpm-edit hidden" id="bpmEditWrap">
              <button class="bpm-step" id="bpmDown">−</button>
              <input type="number" id="bpmInput" class="bpm-input" min="20" max="300" value="120">
              <button class="bpm-step" id="bpmUp">+</button>
            </div>
            <div class="dial-bpm-unit">BPM</div>
            <button class="tap-btn hidden" id="btnTap">TAP</button>
            <div class="dial-pos" id="posLabel">BAR – / – ・ BEAT –</div>
          </div>
        </div>
        <div class="bars-row" id="barsSelect">
          <button data-bars="1">1</button>
          <button data-bars="2">2</button>
          <button data-bars="4" class="active">4</button>
          <button data-bars="8">8</button>
        </div>
        <div class="bars-caption">LOOP LENGTH (BARS) — SELECTED TRACK</div>
        <div class="state-line" id="stateLine">TRACK A 待機中 — REC で次の小節頭から録音</div>
        <div class="transport">
          <button class="deck-btn" id="btnRec" title="REC"><span class="deck-glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle></svg></span><span class="deck-label">REC</span></button>
          <button class="deck-btn" id="btnPlay" disabled title="PLAY"><span class="deck-glyph"><svg viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"></polygon></svg></span><span class="deck-label">PLAY</span></button>
          <button class="deck-btn" id="btnStop" disabled title="STOP"><span class="deck-glyph"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"></rect></svg></span><span class="deck-label">STOP</span></button>
          <button class="deck-btn" id="btnClear" disabled title="CLEAR"><span class="deck-glyph"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></span><span class="deck-label">CLEAR</span></button>
        </div>
        <div class="reset-row"><button id="btnResetBar">小節頭を今にリセット(手動同期)</button></div>
      </div>

      <div class="card">
        <h2>Track Select</h2>
        <div id="trackList"></div>
      </div>
    </div>

    <div style="height:16px;"></div>
    <div class="card">
      <h2>Effects — <span id="fxTrackLabel">TRACK A</span></h2>
      <div class="effects-grid" id="effectsGrid">

<script>
(() => {
  const APP_VERSION = 'v2';
  console.log('[SYNC LOOPER] Script init start. Version:', APP_VERSION);
  window.addEventListener('error', (e) => {
    console.error('[SYNC LOOPER] window error event:', e.message, e.error);

  window.addEventListener('unhandledrejection', (e) => {
    console.error('[SYNC LOOPER] unhandled promise rejection:', e.reason);
  });
  try {
  const els = {
    midiSelect: document.getElementById('midiSelect'),
    midiSelectLabel: document.getElementById('midiSelectLabel'),
    audioInSelect: document.getElementById('audioInSelect'),
    audioOutSelect: document.getElementById('audioOutSelect'),

    btnConnect: document.getElementById('btnConnect'),
    errorLine: document.getElementById('errorLine'),
    setupPanel: document.getElementById('setupPanel'),
    performPanel: document.getElementById('performPanel'),

    syncModeToggle: document.getElementById('syncModeToggle'),
    bpmSetupRow: document.getElementById('bpmSetupRow'),
    bpmSetupInput: document.getElementById('bpmSetupInput'),
    lcdTime: document.getElementById('lcdTime'),
    lcdTag: document.getElementById('lcdTag'),
    bpmNum: document.getElementById('bpmNum'),
    bpmEditWrap: document.getElementById('bpmEditWrap'),
    bpmInput: document.getElementById('bpmInput'),

    trackList: document.getElementById('trackList'),
    effectsGrid: document.getElementById('effectsGrid'),
    fxTrackLabel: document.getElementById('fxTrackLabel'),
    waveCanvas: document.getElementById('waveCanvas'),
    playhead: document.getElementById('playhead'),
    timelineEmpty: document.getElementById('timelineEmpty'),
    timelineTrackLabel: document.getElementById('timelineTrackLabel'),
    btnMidiLearn: document.getElementById('btnMidiLearn'),
    btnKeyLearn: document.getElementById('btnKeyLearn'),
    learnStatus: document.getElementById('learnStatus'),

  console.log('[SYNC LOOPER] DOM elements resolved:', els);
  const missingEls = Object.entries(els).filter(([key, val]) => !val).map(([key]) => key);
  if (missingEls.length){
    console.error('[SYNC LOOPER] Missing DOM elements:', missingEls);

  }
  els.footerLine.textContent = `LOOP CONSOLE — ${APP_VERSION}`;

  const PPQ = 24;
  const PULSES_PER_BAR = PPQ * 4;

  let midiAccess = null, midiInput = null;
  let audioCtx = null, micStream = null, sourceNode = null, workletNode = null, destNode = null, masterGain = null;

  let clockTimestamps = [];
  let pulseCount = 0;
  let running = false;
  let recordedChunks = [];

  // ---------- sync mode / standalone internal clock ----------
  let syncMode = 'external'; // 'external' | 'standalone'
  let standaloneBpm = 120;
  let internalClockTimer = null;
  let internalClockNextTime = 0;
  let tapTimes = [];

  els.syncModeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    syncMode = btn.dataset.mode;
    [...els.syncModeToggle.children].forEach(b => b.classList.toggle('active', b === btn));
    els.bpmSetupRow.classList.toggle('hidden', syncMode !== 'standalone');
    els.midiSelectLabel.textContent = syncMode === 'standalone' ? 'MIDI入力(コントローラー・任意)' : 'MIDI入力(クロックのマスター)';
    console.log('[SYNC LOOPER] Setup sync mode changed to:', syncMode);
  });

  function pulseIntervalMs(){ return 60000 / standaloneBpm / PPQ; }

  function scheduleInternalPulse(){
    const now = performance.now();
    const delay = Math.max(0, internalClockNextTime - now);
    internalClockTimer = setTimeout(() => {
      handleClockPulse();
      internalClockNextTime += pulseIntervalMs();
      scheduleInternalPulse();
    }, delay);
  }

  function startInternalClock(){
    console.log('[SYNC LOOPER] Starting internal clock at', standaloneBpm, 'BPM');
    pulseCount = 0;
    running = true;
    setSyncUI(true);
    internalClockNextTime = performance.now();
    scheduleInternalPulse();
  }

  function updateBpmModeUI(){
    const standalone = syncMode === 'standalone';
    els.bpmNum.classList.toggle('hidden', standalone);
    els.bpmEditWrap.classList.toggle('hidden', !standalone);
    els.btnTap.classList.toggle('hidden', !standalone);
    els.syncModeBadge.classList.remove('hidden');
    els.syncModeBadge.textContent = standalone ? 'INTERNAL' : 'EXT CLOCK';
  }

  els.bpmInput.addEventListener('change', () => {
    let v = parseFloat(els.bpmInput.value);
    if (!isFinite(v) || v <= 0) v = standaloneBpm;
    v = Math.min(300, Math.max(20, v));
    standaloneBpm = v;
    els.bpmInput.value = v;
    console.log('[SYNC LOOPER] Standalone BPM set to', v);
  });
  els.bpmUp.addEventListener('click', () => { standaloneBpm = Math.min(300, standaloneBpm + 1); els.bpmInput.value = standaloneBpm; });
  els.bpmDown.addEventListener('click', () => { standaloneBpm = Math.max(20, standaloneBpm - 1); els.bpmInput.value = standaloneBpm; });

  els.btnTap.addEventListener('click', () => {
    const now = performance.now();
    if (tapTimes.length && now - tapTimes[tapTimes.length-1] > 2000) tapTimes = [];
    tapTimes.push(now);
    if (tapTimes.length > 8) tapTimes.shift();
    if (tapTimes.length >= 2){
      const intervals = [];
      for (let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const bpm = Math.min(300, Math.max(20, Math.round((60000/avg)*10)/10));
      standaloneBpm = bpm;
      els.bpmInput.value = bpm;
      console.log('[SYNC LOOPER] Tap tempo ->', bpm, 'BPM');
    }
  });

  const FX_NAMES = ['reverb','delay','filter','reverse','tape'];

  const tracks = ['A','B','C','D'].map(id => ({
    id, bars:4, buffer:null, originalBuffer:null, reversed:false,
    source:null, state:'empty', recordTargetPulse:0, playStartTime:0,
    loopStartPulse:0, recAlignRefId:null, recAlignRefLen:0, recAlignRefStart:0,
    fx:{ reverb:false, delay:false, filter:false, reverse:false, tape:false },
    fxPending:{ reverb:null, delay:null, filter:null, reverse:null, tape:null },
    fxAmount:{ reverb:50, delay:50, filter:50, tape:50 },
    fxChain:null
  }));
  let selectedId = 'A';
  const getSelected = () => tracks.find(t => t.id === selectedId);

  // ---------- MIDI mapping state ----------
  let midiLearnActive = false;
  let pendingLearnAction = null;
  let midiMappings = {};

  function loadMappings(){
    try{ midiMappings = JSON.parse(localStorage.getItem('syncLooperMidiMappings') || '{}'); }
    catch(e){ midiMappings = {}; }
    console.log('[SYNC LOOPER] Loaded MIDI mappings:', midiMappings);
  }
  function saveMappings(){
    try{ localStorage.setItem('syncLooperMidiMappings', JSON.stringify(midiMappings)); }
    catch(e){ console.error('[SYNC LOOPER] Failed to save MIDI mappings', e); }
  }
  loadMappings();

  // ---------- Keyboard mapping state ----------
  let keyLearnActive = false;
  let pendingKeyLearnAction = null;
  let keyMappings = {};

  // 縦4列をミキサー風に: 1QAZ=Track A, 2WSX=Track B, 3EDC=Track C, 4RFV=Track D
  // 上段=REC, 2段目=STOP, 3段目=PLAY, 最下段=CLEAR
  const DEFAULT_KEY_MAPPINGS = {
    '1':'transport:rec:A',  'q':'transport:stop:A', 'a':'transport:play:A', 'z':'transport:clear:A',
    '2':'transport:rec:B',  'w':'transport:stop:B', 's':'transport:play:B', 'x':'transport:clear:B',
    '3':'transport:rec:C',  'e':'transport:stop:C', 'd':'transport:play:C', 'c':'transport:clear:C',
    '4':'transport:rec:D',  'r':'transport:stop:D', 'f':'transport:play:D', 'v':'transport:clear:D',
    'Escape':'panic',
  };

  function loadKeyMappings(){
    const raw = localStorage.getItem('syncLooperKeyMappings');
    if (raw === null){
      keyMappings = { ...DEFAULT_KEY_MAPPINGS };
    } else {
      try{ keyMappings = JSON.parse(raw); }
      catch(e){ keyMappings = { ...DEFAULT_KEY_MAPPINGS }; }
      // 既存ユーザー向けマイグレーション: まだどのキーにも割り当てられていないデフォルトアクション(例: panic追加時)を、
      // 既存のキー割り当てを壊さずに補完する
      const mappedActions = new Set(Object.values(keyMappings));
      for (const [k, action] of Object.entries(DEFAULT_KEY_MAPPINGS)){
        if (!mappedActions.has(action) && !(k in keyMappings)){
          keyMappings[k] = action;
        }
      }
    }
    saveKeyMappings();
    console.log('[SYNC LOOPER] Loaded keyboard mappings:', keyMappings);
  }
  function saveKeyMappings(){
    try{ localStorage.setItem('syncLooperKeyMappings', JSON.stringify(keyMappings)); }
    catch(e){ console.error('[SYNC LOOPER] Failed to save keyboard mappings', e); }
  }
  loadKeyMappings();

  function showError(msg){
    els.errorLine.textContent = msg;
    els.errorLine.classList.remove('hidden');
  }

  // ---------- dial ticks ----------
  function buildTicks(){
    els.dialTicks.innerHTML = '';
    const bars = getSelected().bars;
    const total = bars * 4;
    for (let i = 0; i < total; i++){
      const angle = (i / total) * 2 * Math.PI;
      const isBarStart = i % 4 === 0;
      const rOuter = 46, rInner = isBarStart ? 40 : 42.5;
      const x1 = 50 + rOuter * Math.cos(angle), y1 = 50 + rOuter * Math.sin(angle);
      const x2 = 50 + rInner * Math.cos(angle), y2 = 50 + rInner * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'tick' + (isBarStart ? ' bar-start' : ''));
      els.dialTicks.appendChild(line);
    }
  }

  function updateDialProgress(){
    const t = getSelected();
    const total = t.bars * PULSES_PER_BAR;
    const pos = pulseCount % total;
    const frac = total ? pos / total : 0;
    els.dialProgress.setAttribute('stroke-dashoffset', String(100 - frac * 100));
    els.dialProgress.classList.remove('rec','play','armed');
    if (t.state === 'recording') els.dialProgress.classList.add('rec');
    else if (t.state === 'playing') els.dialProgress.classList.add('play');
    else if (t.state === 'rec-armed' || t.state === 'play-armed' || t.state === 'stop-armed') els.dialProgress.classList.add('armed');

    const barIdx = Math.floor(pos / PULSES_PER_BAR) + 1;
    const beatIdx = Math.floor((pos % PULSES_PER_BAR) / PPQ) + 1;
    els.posLabel.textContent = `BAR ${barIdx}/${t.bars} ・ BEAT ${beatIdx}`;
    els.dialTrackLabel.textContent = `TRACK ${t.id}`;
  }

  // ---------- LCD timer ----------
  let timerInterval = null, timerStartMs = 0;
  function formatTime(ms){
    const totalCs = Math.floor(ms/10), cs = totalCs%100;
    const totalSec = Math.floor(totalCs/100), sec = totalSec%60, min = Math.floor(totalSec/60);
    return `${min}:${String(sec).padStart(2,'0')}:${String(cs).padStart(2,'0')}`;
  }
  function startTimer(){
    timerStartMs = performance.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { els.lcdTime.textContent = formatTime(performance.now()-timerStartMs); }, 30);
  }
  function freezeTimer(){ if (timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
  function resetTimerDisplay(){ freezeTimer(); els.lcdTime.textContent = '0:00:00'; }

  // ---------- setup / connect ----------
  console.log('[SYNC LOOPER] Attaching btnGrant click listener. Element:', els.btnGrant);
  els.btnGrant.addEventListener('click', async () => {
    console.log('[SYNC LOOPER] Button clicked');
    els.errorLine.classList.add('hidden');
    try{
      console.log('[SYNC LOOPER] getUserMedia start');
      const tempStream = await navigator.mediaDevices.getUserMedia({audio:true});
      console.log('[SYNC LOOPER] getUserMedia success', tempStream);
      tempStream.getTracks().forEach(t => t.stop());

      console.log('[SYNC LOOPER] enumerateDevices start');
      const devices = await navigator.mediaDevices.enumerateDevices();
      console.log('[SYNC LOOPER] enumerateDevices success. count=', devices.length, devices);
      const ins = devices.filter(d => d.kind === 'audioinput');
      const outs = devices.filter(d => d.kind === 'audiooutput');
      console.log('[SYNC LOOPER] audioinput count=', ins.length, 'audiooutput count=', outs.length);

      els.audioInSelect.innerHTML = ins.map(d => `<option value="${d.deviceId}">${d.label || 'マイク/入力'}</option>`).join('');
      els.audioOutSelect.innerHTML = outs.length ? outs.map(d => `<option value="${d.deviceId}">${d.label || '出力'}</option>`).join('') : '<option value="">既定の出力</option>';
      els.audioInSelect.disabled = false; els.audioOutSelect.disabled = false;
      console.log('[SYNC LOOPER] Audio select elements populated');

      if (!navigator.requestMIDIAccess){
        console.error('[SYNC LOOPER] navigator.requestMIDIAccess is not available in this browser');
        els.midiSelect.innerHTML = '<option value="">なし(このブラウザはWeb MIDI未対応)</option>';
        els.midiSelect.disabled = false;
      } else {
        console.log('[SYNC LOOPER] requestMIDIAccess start');
        midiAccess = await navigator.requestMIDIAccess({sysex:false});
        console.log('[SYNC LOOPER] requestMIDIAccess success', midiAccess);
        const midiIns = Array.from(midiAccess.inputs.values());
        console.log('[SYNC LOOPER] MIDI input count=', midiIns.length, midiIns.map(m => m.name));
        const noneOption = '<option value="">なし(MIDIを使わない)</option>';
        if (midiIns.length === 0){
          els.midiSelect.innerHTML = noneOption;
          els.midiSelect.disabled = false;
          if (syncMode === 'external') showError('MIDI入力デバイスが見つかりません。外部クロックモードを使う場合はCircuit等を接続してから再度お試しください。');
        } else {
          els.midiSelect.innerHTML = noneOption + midiIns.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
          els.midiSelect.disabled = false;
        }
      }
      els.btnGrant.classList.add('hidden'); els.btnConnect.classList.remove('hidden');
      console.log('[SYNC LOOPER] Setup flow complete. Connect button shown.');
    } catch(err){
      console.error('[SYNC LOOPER] Error during setup flow:', err.name, err.message, err);
      showError('権限の取得に失敗しました: ' + err.name + ' - ' + err.message);
      alert('[SYNC LOOPER] エラー発生: ' + err.name + ' - ' + err.message);
    }
  });
  console.log('[SYNC LOOPER] btnGrant click listener attached successfully');

  els.btnConnect.addEventListener('click', async () => {
    els.errorLine.classList.add('hidden');
    if (syncMode === 'external' && !els.midiSelect.value){
      showError('外部クロックモードではMIDI入力を選択してください。スタンドアロンモードに切り替えることもできます。');
      return;
    }
    if (syncMode === 'standalone'){
      let v = parseFloat(els.bpmSetupInput.value);
      if (!isFinite(v) || v <= 0) v = 120;
      standaloneBpm = Math.min(300, Math.max(20, v));
    }
    try{
      await connect();
      els.setupPanel.classList.add('hidden');
      els.performPanel.classList.remove('hidden');
      requestWakeLock();
      updateBpmModeUI();
      if (syncMode === 'standalone'){
        els.bpmInput.value = standaloneBpm;
        startInternalClock();
      }
      buildTicks(); updateDialProgress(); renderTrackList(); renderTimeline(); renderEffectsGrid(); renderMappingsList(); renderKeyMappingsList();
      requestAnimationFrame(playheadLoop);
    } catch(err){ showError('接続に失敗しました: ' + err.message); }
  });

  function makeStage(buildWetChain){
    const input = audioCtx.createGain();
    const dry = audioCtx.createGain(); dry.gain.value = 1;
    const wet = audioCtx.createGain(); wet.gain.value = 0;
    const output = audioCtx.createGain();
    input.connect(dry); dry.connect(output);
    const wetOut = buildWetChain(input);
    wetOut.connect(wet); wet.connect(output);
    return { input, output, setWet(w){ wet.gain.value = w; } };
  }
  function makeImpulse(ctx, duration, decay){
    const rate = ctx.sampleRate, length = Math.floor(rate*duration);
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for (let i=0;i<length;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay); }
    }
    return impulse;
  }
  function makeSaturationCurve(amount){
    const n = 4096, curve = new Float32Array(n), k = amount * 60 + 1;
    for (let i=0;i<n;i++){ const x = i*2/n - 1; curve[i] = (1+k)*x/(1+k*Math.abs(x)); }
    return curve;
  }

  function buildTrackFxChain(){
    const input = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 20000;
    const delayStage = makeStage((inp) => {
      const delay = audioCtx.createDelay(1.5);
      delay.delayTime.value = 0.27;
      const fb = audioCtx.createGain(); fb.gain.value = 0.35;
      inp.connect(delay); delay.connect(fb); fb.connect(delay);
      return delay;
    });
    const reverbStage = makeStage((inp) => {
      const conv = audioCtx.createConvolver();
      conv.buffer = makeImpulse(audioCtx, 2.2, 3.2);
      inp.connect(conv);
      return conv;
    });
    const tapeStage = makeStage((inp) => {
      const shaper = audioCtx.createWaveShaper();
      shaper.curve = makeSaturationCurve(0.35);
      shaper.oversample = '4x';
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5500;
      inp.connect(shaper); shaper.connect(lp);
      return lp;
    });
    input.connect(filter);
    filter.connect(delayStage.input);
    delayStage.output.connect(reverbStage.input);
    reverbStage.output.connect(tapeStage.input);
    return { input, filter, delayStage, reverbStage, tapeStage, output: tapeStage.output };
  }

  async function connect(){
    const midiId = els.midiSelect.value;
    if (syncMode === 'external'){
      midiInput = midiAccess ? midiAccess.inputs.get(midiId) : null;
      if (!midiInput) throw new Error('MIDI入力を取得できません');
      midiInput.onmidimessage = onMidiMessage;
      console.log('[SYNC LOOPER] External clock mode: attached to MIDI input', midiInput.name);
    } else {
      if (midiId && midiAccess){
        midiInput = midiAccess.inputs.get(midiId) || null;
        if (midiInput){ midiInput.onmidimessage = onMidiMessage; console.log('[SYNC LOOPER] Standalone mode: MIDI controller attached for mapping only', midiInput.name); }
      } else {
        midiInput = null;
        console.log('[SYNC LOOPER] Standalone mode: no MIDI controller selected');
      }
    }

    const audioInId = els.audioInSelect.value;
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ deviceId: audioInId ? {exact:audioInId} : undefined, echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaStreamSource(micStream);

    const workletCode = `
      class RecorderProcessor extends AudioWorkletProcessor {
        process(inputs){
          const input = inputs[0];
          if (input && input.length > 0 && input[0].length > 0){
            this.port.postMessage(input.map(ch => ch.slice()));
          }
          return true;
        }
      }
      registerProcessor('recorder-processor', RecorderProcessor);
    `;
    const blobUrl = URL.createObjectURL(new Blob([workletCode], {type:'application/javascript'}));
    await audioCtx.audioWorklet.addModule(blobUrl);
    workletNode = new AudioWorkletNode(audioCtx, 'recorder-processor');
    workletNode.port.onmessage = (e) => {
      const t = getSelected();
      if (t.state === 'recording') recordedChunks.push(e.data);
    };
    sourceNode.connect(workletNode);

    // ---- per-track effects chains + shared master sum ----
    masterGain = audioCtx.createGain();
    tracks.forEach(t => {
      t.fxChain = buildTrackFxChain();
      t.fxChain.output.connect(masterGain);
      applyTrackFx(t, 'reverb'); applyTrackFx(t, 'delay'); applyTrackFx(t, 'filter'); applyTrackFx(t, 'tape');
    });

    destNode = audioCtx.createMediaStreamDestination();
    masterGain.connect(destNode);
    els.outputEl.srcObject = destNode.stream;
    const audioOutId = els.audioOutSelect.value;
    if (audioOutId && typeof els.outputEl.setSinkId === 'function'){
      try { await els.outputEl.setSinkId(audioOutId); } catch(e){ showError('出力デバイスの指定に失敗しました。既定の出力を使用します。'); }
    }
    await els.outputEl.play().catch(()=>{});
  }

  // ---------- MIDI clock + control input ----------
  function onMidiMessage(e){
    const status = e.data[0];
    if (syncMode === 'external'){
      if (status === 0xF8){ handleClockPulse(); return; }
      if (status === 0xFA){ pulseCount = 0; running = true; setSyncUI(true); return; }
      if (status === 0xFB){ running = true; setSyncUI(true); return; }
      if (status === 0xFC){ running = false; return; }
    } else {
      if (status === 0xF8 || status === 0xFA || status === 0xFB || status === 0xFC) return;
    }

    const statusType = status & 0xF0;
    if (statusType === 0x90 || statusType === 0xB0){
      const data1 = e.data[1];
      const data2 = e.data.length > 2 ? e.data[2] : 0;
      const isTrigger = statusType === 0x90 ? data2 > 0 : data2 >= 64;
      if (!isTrigger) return;
      const channel = status & 0x0F;
      const key = (statusType === 0x90 ? 'noteon_' : 'cc_') + channel + '_' + data1;
      console.log('[SYNC LOOPER] MIDI control message received:', key);

      if (midiLearnActive && pendingLearnAction){
        for (const k of Object.keys(midiMappings)){ if (midiMappings[k] === pendingLearnAction) delete midiMappings[k]; }
        midiMappings[key] = pendingLearnAction;
        saveMappings(); renderMappingsList();
        console.log('[SYNC LOOPER] MIDI mapping created:', key, '->', pendingLearnAction);
        pendingLearnAction = null;
        updateLearnStatusUI();
      } else if (!midiLearnActive && key in midiMappings){
        executeAction(midiMappings[key]);
      }
    }
  }
  function setSyncUI(on){ els.syncLed.classList.toggle('on', on); }

  function handleClockPulse(){
    if (syncMode === 'external'){
      const now = performance.now();
      clockTimestamps.push(now);
      if (clockTimestamps.length > 48) clockTimestamps.shift();
      updateBpm();
      if (!running){ running = true; setSyncUI(true); }
    } else {
      els.bpmNum.textContent = standaloneBpm.toFixed(1);
    }
    pulseCount++;
    const posInBar = pulseCount % PULSES_PER_BAR;
    const barBoundary = posInBar === 0;

    for (const t of tracks){
      if (t.state === 'rec-armed' && barBoundary){
        startRecording(t);
      } else if (t.state === 'recording' && pulseCount >= t.recordTargetPulse){
        stopRecordingAndPlay(t);
      } else if (t.state === 'play-armed' && barBoundary){
        startPlayback(t);
      } else if (t.state === 'stop-armed' && barBoundary){
        stopPlayback(t);
      }

      if (barBoundary){
        FX_NAMES.forEach(name => {
          if (t.fxPending[name] !== null){
            t.fx[name] = t.fxPending[name];
            t.fxPending[name] = null;
            applyTrackFx(t, name);
            if (t.id === selectedId) renderEffectsGrid();
          }
        });
      }
    }
    updateDialProgress();
  }

  function updateBpm(){
    if (clockTimestamps.length < 2) return;
    let sum = 0;
    for (let i=1;i<clockTimestamps.length;i++) sum += clockTimestamps[i]-clockTimestamps[i-1];
    const avg = sum/(clockTimestamps.length-1);
    const bpm = 60000/(avg*PPQ);
    if (isFinite(bpm)) els.bpmNum.textContent = bpm.toFixed(1);
  }

  // ---------- bars ----------
  els.barsSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-bars]');
    const t = getSelected();
    if (!btn || t.state !== 'empty') return;
    t.bars = parseInt(btn.dataset.bars, 10);
    [...els.barsSelect.children].forEach(b => b.classList.toggle('active', b === btn));
    buildTicks(); updateDialProgress();
  });

  // ---------- recording / playback per track ----------
  function startRecording(t){
    recordedChunks = [];
    t.state = 'recording';
    t.recordTargetPulse = pulseCount + t.bars * PULSES_PER_BAR;
    updateTransportUI(); renderTrackList();
    if (t.id === selectedId){ els.stateLine.textContent = `TRACK ${t.id} 録音中 — ${t.bars}小節`; els.lcdTag.textContent = 'REC'; startTimer(); }
  }

  function stopRecordingAndPlay(t){
    if (t.id === selectedId) freezeTimer();
    const chunks = recordedChunks;
    recordedChunks = [];
    if (chunks.length === 0){
      t.state = 'empty';
      updateTransportUI(); renderTrackList();
      if (t.id === selectedId){ els.stateLine.textContent = '録音データがありませんでした。入力レベルを確認してください。'; els.lcdTag.textContent = 'READY'; }
      return;
    }
    const numChannels = chunks[0].length;
    const sampleRate = audioCtx.sampleRate;
    const totalLength = chunks.reduce((sum,c) => sum + c[0].length, 0);
    const buffer = audioCtx.createBuffer(numChannels, totalLength, sampleRate);
    for (let ch=0; ch<numChannels; ch++){
      const data = buffer.getChannelData(ch);
      let offset = 0;
      for (const c of chunks){ data.set(c[ch], offset); offset += c[ch].length; }
    }
    t.buffer = buffer;
    t.originalBuffer = buffer;
    t.reversed = false;
    t.fx.reverse = false;
    startPlayback(t);
    renderTrackList();
    if (t.id === selectedId){ renderTimeline(); renderEffectsGrid(); }
  }

  function startPlayback(t){
    if (!t.buffer || !t.fxChain) return;
    if (t.source){ try{ t.source.stop(); }catch(e){} }
    const src = audioCtx.createBufferSource();
    src.buffer = t.buffer;
    src.loop = true;
    src.connect(t.fxChain.input);
    src.start();
    t.source = src;
    t.playStartTime = audioCtx.currentTime;
    t.loopStartPulse = pulseCount;
    t.state = 'playing';
    updateTransportUI(); renderTrackList();
    if (t.id === selectedId){
      els.stateLine.textContent = `TRACK ${t.id} ループ再生中`;
      els.lcdTag.textContent = 'PLAY';
      els.lcdTime.textContent = formatTime(t.buffer.duration*1000);
    }
  }

  function stopPlayback(t){
    if (t.source){ try{ t.source.stop(); }catch(e){} t.source = null; }
    t.state = 'stopped';
    updateTransportUI(); renderTrackList();
    if (t.id === selectedId){ els.stateLine.textContent = `TRACK ${t.id} 停止中 — PLAYで再生 / CLEARで削除`; els.lcdTag.textContent = 'STOP'; }
  }

  // ---------- transport actions (shared by buttons + MIDI/keyboard mapping) ----------
  // targetId を渡すとそのトラックを対象に、省略時は選択中トラックを対象にする
  function triggerRec(targetId){
    if (targetId && targetId !== selectedId) selectTrack(targetId);
    const t = getSelected();
    if (t.state === 'rec-armed'){ t.state = t.buffer ? 'stopped' : 'empty'; t.recAlignRefId = null; updateTransportUI(); renderTrackList(); els.stateLine.textContent = `TRACK ${t.id} 待機中 — REC で次の小節頭から録音`; els.lcdTag.textContent = 'READY'; return; }
    if (!(t.state === 'empty' || t.state === 'stopped')) return;
    if (!running){ showError('クロックが動作していません。接続設定を確認してください。'); return; }
    if (t.state === 'stopped') stopPlayback(t);

    // 他に再生中のトラックがあれば、その中で最も長いループの周回頭(小節1拍目に戻る瞬間)まで待つ
    const playingTracks = tracks.filter(tr => tr.state === 'playing' && tr.id !== t.id);
    if (playingTracks.length > 0){
      const ref = playingTracks.reduce((a,b) => (b.bars > a.bars ? b : a));
      t.recAlignRefId = ref.id;
      t.recAlignRefLen = ref.bars * PULSES_PER_BAR;
      t.recAlignRefStart = ref.loopStartPulse;
    } else {
      t.recAlignRefId = null;
    }

    t.state = 'rec-armed';
    updateTransportUI(); renderTrackList();
    els.stateLine.textContent = t.recAlignRefId
      ? `TRACK ${t.id} 録音待機中 — TRACK ${t.recAlignRefId} の周回頭で開始します`
      : `TRACK ${t.id} 録音待機中 — 次の小節頭で開始します`;
    els.lcdTag.textContent = 'ARMED';
  }

  function triggerPlay(targetId){
    if (targetId && targetId !== selectedId) selectTrack(targetId);
    const t = getSelected();
    if (t.state === 'play-armed'){ t.state = 'stopped'; updateTransportUI(); renderTrackList(); return; }
    if (t.state !== 'stopped') return;
    if (running){
      t.state = 'play-armed';
      updateTransportUI(); renderTrackList();
      els.stateLine.textContent = `TRACK ${t.id} 再生待機中 — 次の小節頭で開始します`;
    } else {
      startPlayback(t);
    }
  }

  function triggerStop(targetId){
    if (targetId && targetId !== selectedId) selectTrack(targetId);
    const t = getSelected();
    if (t.state === 'stop-armed'){
      t.state = 'playing';
      updateTransportUI(); renderTrackList();
      if (t.id === selectedId){ els.stateLine.textContent = `TRACK ${t.id} ループ再生中`; els.lcdTag.textContent = 'PLAY'; }
      return;
    }
    if (t.state !== 'playing') return;
    if (!running){ stopPlayback(t); return; }
    t.state = 'stop-armed';
    updateTransportUI(); renderTrackList();
    if (t.id === selectedId){ els.stateLine.textContent = `TRACK ${t.id} 停止待機中 — 次の小節頭で停止します`; els.lcdTag.textContent = 'STOP\u2248'; }
  }

  function triggerClear(targetId){
    if (targetId && targetId !== selectedId) selectTrack(targetId);
    const t = getSelected();
    if (t.source){ try{ t.source.stop(); }catch(e){} t.source = null; }
    t.buffer = null; t.originalBuffer = null; t.reversed = false; t.fx.reverse = false;
    t.state = 'empty';
    if (t.id === selectedId) resetTimerDisplay();
    updateTransportUI(); renderTrackList(); renderTimeline(); renderEffectsGrid();
    els.stateLine.textContent = `TRACK ${t.id} 待機中 — REC で次の小節頭から録音`;
    els.lcdTag.textContent = 'READY';
  }

  // 全トラックを即座に停止(クオンタイズなし・緊急停止)
  function panicStopAll(){
    tracks.forEach(tr => {
      if (tr.source){ try{ tr.source.stop(); }catch(e){} tr.source = null; }
      if (tr.state === 'recording' || tr.state === 'rec-armed' || tr.state === 'playing' || tr.state === 'play-armed' || tr.state === 'stop-armed'){
        tr.state = tr.buffer ? 'stopped' : 'empty';
      }
      tr.recAlignRefId = null;
      FX_NAMES.forEach(name => { tr.fxPending[name] = null; });
    });
    recordedChunks = [];
    freezeTimer();
    updateTransportUI(); renderTrackList(); renderEffectsGrid(); renderTimeline();
    els.stateLine.textContent = '全トラック停止(PANIC)';
    els.lcdTag.textContent = 'STOP';
    console.log('[SYNC LOOPER] PANIC: all tracks stopped immediately');
  }
  els.btnPanic.addEventListener('click', () => onControlActivate('panic', panicStopAll));

  function selectTrack(id){
    selectedId = id;
    buildTicks(); updateDialProgress(); updateTransportUI(); renderTrackList(); renderTimeline(); renderEffectsGrid();
    const t = getSelected();
    els.timelineTrackLabel.textContent = `TRACK ${t.id}`;
    els.fxTrackLabel.textContent = `TRACK ${t.id}`;
    if (t.state === 'playing'){ els.stateLine.textContent = `TRACK ${t.id} ループ再生中`; els.lcdTag.textContent = 'PLAY'; }
    else if (t.state === 'stopped'){ els.stateLine.textContent = `TRACK ${t.id} 停止中 — PLAYで再生 / CLEARで削除`; els.lcdTag.textContent = 'STOP'; }
    else if (t.state === 'recording'){ els.stateLine.textContent = `TRACK ${t.id} 録音中 — ${t.bars}小節`; els.lcdTag.textContent = 'REC'; }
    else if (t.state === 'rec-armed'){
      els.stateLine.textContent = t.recAlignRefId
        ? `TRACK ${t.id} 録音待機中 — TRACK ${t.recAlignRefId} の周回頭で開始します`
        : `TRACK ${t.id} 録音待機中 — 次の小節頭で開始します`;
      els.lcdTag.textContent = 'ARMED';
    }
    else if (t.state === 'play-armed'){ els.stateLine.textContent = `TRACK ${t.id} 再生待機中 — 次の小節頭で開始します`; els.lcdTag.textContent = 'ARMED'; }
    else if (t.state === 'stop-armed'){ els.stateLine.textContent = `TRACK ${t.id} 停止待機中 — 次の小節頭で停止します`; els.lcdTag.textContent = 'STOP\u2248'; }
    else { els.stateLine.textContent = `TRACK ${t.id} 待機中 — REC で次の小節頭から録音`; els.lcdTag.textContent = 'READY'; }
  }

  // ---------- learn-mode wrapper ----------
  function onControlActivate(actionId, executeFn){
    if (keyLearnActive){
      pendingKeyLearnAction = actionId;
      console.log('[SYNC LOOPER] Key Learn armed for action:', actionId);
      updateLearnStatusUI();
      return;
    }
    if (midiLearnActive){
      pendingLearnAction = actionId;
      console.log('[SYNC LOOPER] MIDI Learn armed for action:', actionId);
      updateLearnStatusUI();
      return;
    }
    executeFn();
  }

  els.btnRec.addEventListener('click', () => onControlActivate('transport:rec', triggerRec));
  els.btnPlay.addEventListener('click', () => onControlActivate('transport:play', triggerPlay));
  els.btnStop.addEventListener('click', () => onControlActivate('transport:stop', triggerStop));
  els.btnClear.addEventListener('click', () => onControlActivate('transport:clear', triggerClear));
  els.btnResetBar.addEventListener('click', () => { pulseCount = 0; updateDialProgress(); });

  function updateTransportUI(){
    const t = getSelected();
    els.btnRec.classList.toggle('armed', t.state === 'rec-armed');
    els.btnRec.classList.toggle('recording', t.state === 'recording');
    els.btnRec.disabled = (t.state === 'recording');
    els.btnPlay.classList.toggle('armed', t.state === 'play-armed');
    els.btnPlay.classList.toggle('playing', t.state === 'playing');
    els.btnPlay.disabled = !(t.state === 'stopped' || t.state === 'play-armed');
    els.btnStop.classList.toggle('armed', t.state === 'stop-armed');
    els.btnStop.disabled = !(t.state === 'playing' || t.state === 'stop-armed');
    els.btnClear.disabled = !(t.buffer || t.state === 'recording' || t.state === 'rec-armed');
    [...els.barsSelect.children].forEach(b => {
      b.disabled = (t.state !== 'empty');
      b.classList.toggle('active', parseInt(b.dataset.bars,10) === t.bars);
    });
  }

  // ---------- track list UI ----------
  function trackMiniBars(t){
    if (!t.buffer){ return Array.from({length:8}, () => `<span></span>`).join(''); }
    const data = t.buffer.getChannelData(0);
    const step = Math.floor(data.length/8) || 1;
    let out = '';
    for (let i=0;i<8;i++){
      let peak = 0;
      const start = i*step;
      for (let j=0;j<step;j++){ const v = Math.abs(data[start+j] || 0); if (v>peak) peak = v; }
      const h = Math.max(15, Math.min(100, peak*140));
      out += `<span class="filled" style="height:${h}%"></span>`;
    }
    return out;
  }

  function renderTrackList(){
    els.trackList.innerHTML = tracks.map(t => {
      const dotClass = t.state === 'recording' ? 'rec' : t.state === 'playing' ? 'play' : (t.state==='rec-armed'||t.state==='play-armed'||t.state==='stop-armed') ? 'armed' : '';
      const dur = t.buffer ? formatTime(t.buffer.duration*1000) : '--:--';
      const label = t.buffer ? `LOOP ${t.id}${t.reversed ? ' (REV)' : ''}` : 'EMPTY';
      return `
        <div class="track-row ${t.id===selectedId?'selected':''}" data-track="${t.id}">
          <span class="track-radio"></span>
          <span class="track-letter">${t.id}</span>
          <div class="track-body">
            <div class="track-mini-bars">${trackMiniBars(t)}</div>
            <div class="track-meta">
              <span><span class="track-state-dot ${dotClass}"></span> ${label}</span>
              <span>${dur}</span>
            </div>
          </div>
        </div>`;
    }).join('');
    [...els.trackList.querySelectorAll('.track-row')].forEach(row => {
      const id = row.dataset.track;
      row.addEventListener('click', () => onControlActivate('track:'+id, () => selectTrack(id)));
    });
  }

  // ---------- effects ----------
  els.effectsGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.fx-toggle');
    if (!btn) return;
    const cell = btn.closest('.fx-cell');
    const fx = cell.dataset.fx;
    onControlActivate('fx:'+selectedId+':'+fx, () => toggleTrackFx(selectedId, fx));
  });

  els.effectsGrid.addEventListener('input', (e) => {
    const slider = e.target.closest('.fx-amount');
    if (!slider) return;
    const cell = slider.closest('.fx-cell');
    const fx = cell.dataset.fx;
    const t = getSelected();
    t.fxAmount[fx] = parseInt(slider.value, 10);
    applyTrackFx(t, fx);
  });

  function toggleTrackFx(trackId, fxName){
    const t = tracks.find(tr => tr.id === trackId);
    if (!t) return;
    // 現在の「見た目上の状態」(未確定の予約があればそれ、なければ確定値)を反転させる
    const effective = t.fxPending[fxName] !== null ? t.fxPending[fxName] : t.fx[fxName];
    const newIntended = !effective;
    if (!running){
      // クロックが動いていなければ待つ意味がないので即時反映
      t.fx[fxName] = newIntended;
      t.fxPending[fxName] = null;
      applyTrackFx(t, fxName);
    } else if (newIntended === t.fx[fxName]){
      // 二度押し等で結局今の状態と同じに戻る場合は予約を取り消すだけ
      t.fxPending[fxName] = null;
    } else {
      // 次の小節頭まで予約(クオンタイズ)
      t.fxPending[fxName] = newIntended;
    }
    if (trackId === selectedId) renderEffectsGrid();
    renderTrackList();
  }

  function filterAmountToFreq(amount){
    const minF = 200, maxF = 20000;
    return maxF * Math.pow(minF / maxF, amount);
  }

  function applyTrackFx(t, fx){
    if (!t.fxChain || !audioCtx) return;
    if (fx === 'reverb') t.fxChain.reverbStage.setWet(t.fx.reverb ? t.fxAmount.reverb/100 : 0);
    if (fx === 'delay') t.fxChain.delayStage.setWet(t.fx.delay ? t.fxAmount.delay/100 : 0);
    if (fx === 'tape') t.fxChain.tapeStage.setWet(t.fx.tape ? t.fxAmount.tape/100 : 0);
    if (fx === 'filter') t.fxChain.filter.frequency.setTargetAtTime(t.fx.filter ? filterAmountToFreq(t.fxAmount.filter/100) : 20000, audioCtx.currentTime, 0.02);
    if (fx === 'reverse') applyReverseToTrack(t);
  }

  function reverseBuffer(buffer){
    const rev = audioCtx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
    for (let ch=0; ch<buffer.numberOfChannels; ch++){
      const src = buffer.getChannelData(ch), dst = rev.getChannelData(ch);
      for (let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
    }
    return rev;
  }

  function applyReverseToTrack(t){
    if (!t.buffer) return;
    t.reversed = t.fx.reverse;
    t.buffer = t.reversed ? reverseBuffer(t.originalBuffer) : t.originalBuffer;
    if (t.state === 'playing') startPlayback(t);
    renderTrackList();
    if (t.id === selectedId) renderTimeline();
  }

  function renderEffectsGrid(){
    const t = getSelected();
    [...els.effectsGrid.querySelectorAll('.fx-cell')].forEach(cell => {
      const fx = cell.dataset.fx;
      const pending = t.fxPending[fx];
      const effective = pending !== null ? pending : t.fx[fx];
      const toggleBtn = cell.querySelector('.fx-toggle');
      toggleBtn.classList.toggle('on', !!effective);
      toggleBtn.classList.toggle('pending', pending !== null);
      const slider = cell.querySelector('.fx-amount');
      if (slider && t.fxAmount[fx] !== undefined){
        slider.value = t.fxAmount[fx];
      }
    });
  }

  // ---------- MIDI learn toggle ----------
  els.btnMidiLearn.addEventListener('click', () => {
    midiLearnActive = !midiLearnActive;
    pendingLearnAction = null;
    if (midiLearnActive){ keyLearnActive = false; pendingKeyLearnAction = null; els.btnKeyLearn.classList.remove('on'); }
    els.btnMidiLearn.classList.toggle('on', midiLearnActive);
    console.log('[SYNC LOOPER] MIDI Learn mode:', midiLearnActive);
    updateLearnStatusUI();
  });

  // ---------- Keyboard learn toggle ----------
  els.btnKeyLearn.addEventListener('click', () => {
    keyLearnActive = !keyLearnActive;
    pendingKeyLearnAction = null;
    if (keyLearnActive){ midiLearnActive = false; pendingLearnAction = null; els.btnMidiLearn.classList.remove('on'); }
    els.btnKeyLearn.classList.toggle('on', keyLearnActive);
    console.log('[SYNC LOOPER] Key Learn mode:', keyLearnActive);
    updateLearnStatusUI();
  });

  // ---------- global keyboard listener ----------
  window.addEventListener('keydown', (e) => {
    // 入力欄にフォーカスがある時はショートカットを無効化
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.repeat) return;
    // パフォーマンス画面が表示されていない時は無効
    if (els.performPanel.classList.contains('hidden')) return;

    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (keyLearnActive && pendingKeyLearnAction){
      e.preventDefault();
      // 同じアクションに既存の別キーがあれば消す
      for (const k of Object.keys(keyMappings)){ if (keyMappings[k] === pendingKeyLearnAction) delete keyMappings[k]; }
      keyMappings[key] = pendingKeyLearnAction;
      saveKeyMappings(); renderKeyMappingsList();
      console.log('[SYNC LOOPER] Key mapping created:', key, '->', pendingKeyLearnAction);
      pendingKeyLearnAction = null;
      updateLearnStatusUI();
      return;
    }

    if (!keyLearnActive && !midiLearnActive && key in keyMappings){
      e.preventDefault();
      executeAction(keyMappings[key]);
    }
  });

  function actionLabel(action){
    if (!action) return '';
    if (action === 'panic') return 'PANIC(全停止)';
    if (action.startsWith('track:')) return `TRACK ${action.split(':')[1]} 選択`;
    if (action.startsWith('transport:')){
      const parts = action.split(':');
      const kindLabel = { rec:'REC', play:'PLAY', stop:'STOP', clear:'CLEAR' }[parts[1]] || parts[1].toUpperCase();
      return parts[2] ? `TRACK ${parts[2]} ${kindLabel}` : kindLabel;
    }
    if (action.startsWith('fx:')){
      const parts = action.split(':');
      return `TRACK ${parts[1]} ${parts[2].toUpperCase()}`;
    }
    return action;
  }

  function noteName(n){
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    return names[n % 12] + (Math.floor(n / 12) - 1);
  }

  function triggerLabel(key){
    const parts = key.split('_');
    const type = parts[0], channel = parseInt(parts[1],10), num = parseInt(parts[2],10);
    if (type === 'noteon') return `NOTE ${noteName(num)} (ch${channel+1})`;
    return `CC${num} (ch${channel+1})`;
  }

  function updateLearnStatusUI(){
    if (keyLearnActive){
      els.learnStatus.classList.remove('hidden');
      if (pendingKeyLearnAction){
        els.learnStatus.textContent = `学習待機中: ${actionLabel(pendingKeyLearnAction)} — 割り当てたいキーを押してください`;
      } else {
        els.learnStatus.textContent = 'KEY LEARN 有効 — マッピングしたいボタンをクリックしてください';
      }
      return;
    }
    if (midiLearnActive){
      els.learnStatus.classList.remove('hidden');
      if (pendingLearnAction){
        els.learnStatus.textContent = `学習待機中: ${actionLabel(pendingLearnAction)} — MIDI機器のノート/CCを操作してください`;
      } else {
        els.learnStatus.textContent = 'MIDI LEARN 有効 — マッピングしたいボタンをクリックしてください';
      }
      return;
    }
    els.learnStatus.classList.add('hidden');
  }

  function executeAction(action){
    if (action === 'panic'){ panicStopAll(); return; }
    if (action.startsWith('track:')){ selectTrack(action.split(':')[1]); return; }
    if (action.startsWith('transport:')){
      const parts = action.split(':'); // transport:rec または transport:rec:A
      const kind = parts[1];
      const targetId = parts[2]; // undefined なら選択中トラック
      if (kind === 'rec'){ triggerRec(targetId); return; }
      if (kind === 'play'){ triggerPlay(targetId); return; }
      if (kind === 'stop'){ triggerStop(targetId); return; }
      if (kind === 'clear'){ triggerClear(targetId); return; }
      return;
    }
    if (action.startsWith('fx:')){
      const parts = action.split(':');
      toggleTrackFx(parts[1], parts[2]);
    }
  }

  function renderMappingsList(){
    const entries = Object.entries(midiMappings);
    if (!entries.length){
      els.mappingsList.innerHTML = '<div class="mapping-empty">マッピングはまだありません。MIDI LEARNをオンにして、操作したいボタンをクリックしてからMIDI機器のノート/CCを送信してください。</div>';
      return;
    }
    els.mappingsList.innerHTML = entries.map(([key,action]) => `
      <div class="mapping-row">
        <span class="mapping-trigger">${triggerLabel(key)}</span>
        <span class="mapping-arrow">→</span>
        <span class="mapping-action">${actionLabel(action)}</span>
        <button class="mapping-remove" data-key="${key}">×</button>
      </div>`).join('');
    [...els.mappingsList.querySelectorAll('.mapping-remove')].forEach(btn => {
      btn.addEventListener('click', () => {
        delete midiMappings[btn.dataset.key];
        saveMappings(); renderMappingsList();
      });
    });
  }

  els.btnClearMappings.addEventListener('click', () => {
    midiMappings = {};
    saveMappings(); renderMappingsList();
  });

  // ---------- keyboard mappings list ----------
  function keyLabel(key){
    if (key === ' ') return 'SPACE';
    if (key.length === 1) return key.toUpperCase();
    return key;
  }

  function renderKeyMappingsList(){
    const entries = Object.entries(keyMappings);
    if (!entries.length){
      els.keyMappingsList.innerHTML = '<div class="mapping-empty">キーマッピングがありません。KEY LEARNをオンにして、操作したいボタンをクリックしてからキーを押してください。</div>';
      return;
    }
    // トラック順→アクション順で見やすく並べる
    const order = { rec:0, stop:1, play:2, clear:3 };
    entries.sort((a,b) => {
      const pa = a[1].split(':'), pb = b[1].split(':');
      const ta = pa[2] || '', tb = pb[2] || '';
      if (ta !== tb) return ta.localeCompare(tb);
      return (order[pa[1]] ?? 9) - (order[pb[1]] ?? 9);
    });
    els.keyMappingsList.innerHTML = entries.map(([key,action]) => `
      <div class="mapping-row">
        <span class="mapping-trigger">${keyLabel(key)}</span>
        <span class="mapping-arrow">→</span>
        <span class="mapping-action">${actionLabel(action)}</span>
        <button class="mapping-remove" data-key="${key}">×</button>
      </div>`).join('');
    [...els.keyMappingsList.querySelectorAll('.mapping-remove')].forEach(btn => {
      btn.addEventListener('click', () => {
        delete keyMappings[btn.dataset.key];
        saveKeyMappings(); renderKeyMappingsList();
      });
    });
  }

  els.btnResetKeyMappings.addEventListener('click', () => {
    keyMappings = { ...DEFAULT_KEY_MAPPINGS };
    saveKeyMappings(); renderKeyMappingsList();
  });

  els.keyMappingsCard.addEventListener('toggle', () => {
    console.log('[SYNC LOOPER] Keyboard Mappings panel', els.keyMappingsCard.open ? 'expanded' : 'collapsed');
  });

  // ---------- timeline waveform ----------
  function renderTimeline(){
    const t = getSelected();
    els.timelineTrackLabel.textContent = `TRACK ${t.id}`;
    const canvas = els.waveCanvas;
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    canvas.width = cw*dpr; canvas.height = ch*dpr;
    const ctx2d = canvas.getContext('2d');
    ctx2d.setTransform(dpr,0,0,dpr,0,0);
    ctx2d.clearRect(0,0,cw,ch);

    if (!t.buffer){ els.timelineEmpty.classList.remove('hidden'); els.playhead.classList.add('hidden'); return; }
    els.timelineEmpty.classList.add('hidden');

    const data = t.buffer.getChannelData(0);
    const step = Math.ceil(data.length/cw);
    const mid = ch/2;
    ctx2d.fillStyle = '#8a8271';
    for (let x=0; x<cw; x++){
      let min=1, max=-1;
      const start = x*step;
      for (let i=0;i<step;i++){
        const idx = start+i;
        if (idx >= data.length) break;
        const v = data[idx];
        if (v<min) min=v;
        if (v>max) max=v;
      }
      if (min>max){ min=0; max=0; }
      const y1 = mid + min*mid*0.85, y2 = mid + max*mid*0.85;
      ctx2d.fillRect(x, Math.min(y1,y2), 1, Math.max(1, Math.abs(y2-y1)));
    }
    ctx2d.strokeStyle = '#c1b9a6';
    ctx2d.lineWidth = 1;
    const displayedBpm = syncMode === 'standalone' ? standaloneBpm : parseFloat(els.bpmNum.textContent || 120);
    const barDur = (60/displayedBpm)*4;
    if (barDur > 0 && isFinite(barDur)){
      const barCount = Math.round(t.buffer.duration / barDur);
      for (let b=0; b<=barCount; b++){
        const x = Math.round((b*barDur/t.buffer.duration) * cw);
        ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,ch); ctx2d.stroke();
      }
    }
  }

  function playheadLoop(){
    const t = getSelected();
    if (t.buffer && t.state === 'playing' && audioCtx){
      const dur = t.buffer.duration;
      const phase = ((audioCtx.currentTime - t.playStartTime) % dur + dur) % dur;
      const cw = els.waveCanvas.clientWidth;
      els.playhead.style.left = (phase/dur*cw) + 'px';
      els.playhead.classList.remove('hidden');
    } else {
      els.playhead.classList.add('hidden');
    }
    requestAnimationFrame(playheadLoop);
  }

  updateTransportUI();
  renderTrackList();
  renderMappingsList();
  renderKeyMappingsList();
  console.log('[SYNC LOOPER] Initial render complete. App ready.');

  // ---------- 誤操作防止: 未保存の録音がある状態でのタブ離脱を警告 ----------
  function hasActiveSessionContent(){
    return tracks.some(t => t.buffer || ['recording','rec-armed','play-armed','stop-armed'].includes(t.state));
  }
  window.addEventListener('beforeunload', (e) => {
    if (!hasActiveSessionContent()) return;
    console.log('[SYNC LOOPER] beforeunload: active session content detected, warning before close');
    e.preventDefault();
    e.returnValue = '';
  });

  // ---------- フルスクリーン切り替え ----------
  els.btnFullscreen.addEventListener('click', async () => {
    try{
      if (!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
        console.log('[SYNC LOOPER] Entered fullscreen');
      } else {
        await document.exitFullscreen();
        console.log('[SYNC LOOPER] Exited fullscreen');
      }
    } catch(err){
      console.error('[SYNC LOOPER] Fullscreen toggle failed:', err.name, err.message);
    }
  });
  document.addEventListener('fullscreenchange', () => {
    els.btnFullscreen.classList.toggle('on', !!document.fullscreenElement);
  });

  // ---------- Screen Wake Lock: パフォーマンス中の画面スリープを防止 ----------
  let wakeLock = null;
  async function requestWakeLock(){
    if (!('wakeLock' in navigator)) return;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('[SYNC LOOPER] Wake Lock acquired');
      wakeLock.addEventListener('release', () => {
        console.log('[SYNC LOOPER] Wake Lock released');
      });
    } catch(err){
      console.error('[SYNC LOOPER] Wake Lock request failed:', err.name, err.message);
    }
  }
  document.addEventListener('visibilitychange', () => {
    // Wake LockはタブがhiddenになるとOS側で自動解放されるため、再びvisibleになったら再取得する
    if (document.visibilityState === 'visible' && !els.performPanel.classList.contains('hidden')){
      requestWakeLock();
    }
  });
  } catch (initErr) {
    console.error('[SYNC LOOPER] Fatal init error (script aborted):', initErr);
    alert('[SYNC LOOPER] 初期化に失敗しました: ' + initErr.name + ' - ' + initErr.message);
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('[SYNC LOOPER] Service Worker registered:', reg.scope))
        .catch((err) => console.error('[SYNC LOOPER] Service Worker registration failed:', err));
    });
  }
</script>
</body>
