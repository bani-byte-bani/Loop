<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOP CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#c9c2b0;
    --body-a:#f2eee2;
    --body-b:#ddd6c4;
    --panel:#eae4d6;
    --shell-edge:#b8b09c;
    --ink:#2b2820;
    --ink-dim:#8a8271;
    --ink-faint:#b3ab98;
    --line:#c1b9a6;
    --screen-bg:#12140f;
    --screen-fg:#6fc7ff;
    --red:#c23b2e;
    --green:#3f8f5f;
    --pink:#c2588f;
    --blue:#3e6bcf;
    --amber:#c9862f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% -20%, #d8d1bf 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 14px 80px;
  }
  .console{
    width:100%;
    max-width:860px;
    background:linear-gradient(160deg, var(--body-a) 0%, var(--body-b) 100%);
    border:1px solid var(--shell-edge);
    border-radius:20px;
    padding:20px;
    box-shadow:0 30px 60px -24px rgba(30,25,15,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .brand{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; }
  .brand-sub{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.18em; color:var(--ink-dim); margin-top:2px; }
  .led-mini{ width:7px;height:7px;border-radius:50%; background:var(--red); opacity:0.25; transition:opacity .15s, box-shadow .15s; }
  .led-mini.on{ opacity:1; box-shadow:0 0 6px var(--red); }
  .hairline{ height:1px; background:linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent); margin:14px 0; }
  .hidden{ display:none !important; }

  /* setup */
  .setup label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; }
  .setup select{ width:100%; padding:10px; margin-bottom:12px; background:#f7f4ec; color:var(--ink); border:1px solid var(--line); border-radius:8px; font-family:'Noto Sans JP', sans-serif; font-size:13px; }
  .btn-slab{ width:100%; cursor:pointer; padding:14px; border-radius:10px; border:1px solid var(--shell-edge); background:linear-gradient(180deg,#f7f4ec,#e6e0cf); color:var(--ink); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; box-shadow:0 2px 0 rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7); }
  .btn-slab:active{ transform:translateY(1px); }
  .error{ color:var(--red); font-size:11px; margin-top:10px; font-family:'JetBrains Mono', monospace; }

  /* main grid */
  .main-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:720px){ .main-grid{ grid-template-columns:1.15fr 1fr; } }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h2{ margin:0 0 12px; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.16em; color:var(--ink-dim); text-transform:uppercase; }

  .lcd{ background:var(--screen-bg); border-radius:6px; padding:9px 13px; display:flex; align-items:baseline; justify-content:space-between; box-shadow:inset 0 2px 6px rgba(0,0,0,0.6); margin-bottom:16px; }
  .lcd-time{ font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--screen-fg); letter-spacing:0.05em; text-shadow:0 0 8px rgba(111,199,255,0.5); font-variant-numeric:tabular-nums; }
  .lcd-tag{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--screen-fg); opacity:0.7; letter-spacing:0.14em; }

  .dial-wrap{ position:relative; width:210px; height:210px; margin:4px auto 6px; }
  .dial-svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .dial-face{ fill:#efe9db; stroke:var(--line); stroke-width:1; }
  .dial-progress{ fill:none; stroke:var(--ink-dim); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset .05s linear, stroke .2s ease; }
  .dial-progress.rec{ stroke:var(--red); }
  .dial-progress.play{ stroke:var(--green); }
  .dial-progress.armed{ stroke:var(--amber); }
  .tick{ stroke:var(--ink-dim); stroke-width:1; opacity:0.5; }
  .tick.bar-start{ stroke:var(--ink); stroke-width:1.6; opacity:0.85; }
  .dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .dial-track-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); letter-spacing:0.1em; margin-bottom:4px; }
  .dial-bpm{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:30px; line-height:1; }
  .dial-bpm-unit{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.2em; margin-top:3px; }
  .dial-pos{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); margin-top:7px; }

  .bars-row{ display:flex; gap:6px; justify-content:center; margin:12px 0 4px; }
  .bars-row button{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#f4f0e5; color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; cursor:pointer; }
  .bars-row button.active{ background:var(--ink); color:var(--body-a); border-color:var(--ink); }
  .bars-row button:disabled{ opacity:0.4; cursor:not-allowed; }
  .bars-caption{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.14em; margin-bottom:14px; }

  .state-line{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); margin-bottom:12px; min-height:14px; }

  .transport{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .deck-btn{ position:relative; aspect-ratio:1; border-radius:12px; border:1px solid var(--shell-edge); background:linear-gradient(180deg,#f7f4ec,#e2dbc8); box-shadow:0 2px 0 rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.7); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .deck-btn:active{ transform:translateY(1px); }
  .deck-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .deck-glyph{ width:19px; height:19px; }
  .deck-glyph svg{ width:100%; height:100%; }
  .deck-label{ position:absolute; bottom:5px; font-family:'JetBrains Mono', monospace; font-size:7px; letter-spacing:0.1em; color:var(--ink-dim); }
  #btnRec .deck-glyph circle{ fill:var(--red); }
  #btnRec.armed{ animation:blinkbg 0.6s step-start infinite; }
  #btnRec.recording{ background:linear-gradient(180deg,#f3d9d5,#e8c2bc); }
  @keyframes blinkbg{ 50%{ background:linear-gradient(180deg,#f3d9d5,#e8c2bc); } }
  #btnPlay .deck-glyph polygon{ fill:var(--ink); }
  #btnPlay.armed{ animation:blinkbg2 0.6s step-start infinite; }
  #btnPlay.playing{ background:linear-gradient(180deg,#d9ecdf,#c3ddc9); }
  #btnPlay.playing .deck-glyph polygon{ fill:var(--green); }
  @keyframes blinkbg2{ 50%{ background:linear-gradient(180deg,#d9ecdf,#c3ddc9); } }
  #btnStop .deck-glyph rect{ fill:var(--ink); }
  #btnClear .deck-glyph line{ stroke:var(--ink); }

  .reset-row{ text-align:center; margin-top:12px; }
  .reset-row button{ background:none; border:none; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); text-decoration:underline; }

  /* track select */
  .track-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .track-row:last-child{ border-bottom:none; }
  .track-radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-faint); flex:none; position:relative; }
  .track-row.selected .track-radio{ border-color:var(--blue); }
  .track-row.selected .track-radio::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--blue); }
  .track-letter{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; width:20px; flex:none; }
  .track-body{ flex:1; min-width:0; }
  .track-mini-bars{ display:flex; gap:2px; height:16px; align-items:flex-end; margin-bottom:5px; }
  .track-mini-bars span{ flex:1; background:var(--ink-faint); border-radius:1px; min-height:3px; }
  .track-mini-bars span.filled{ background:var(--ink-dim); }
  .track-meta{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); }
  .track-state-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .track-state-dot.rec{ background:var(--red); box-shadow:0 0 5px var(--red); }
  .track-state-dot.play{ background:var(--green); box-shadow:0 0 5px var(--green); }
  .track-state-dot.armed{ background:var(--amber); box-shadow:0 0 5px var(--amber); }

  /* effects */
  .effects-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .fx-btn{ background:#f4f0e5; border:1px solid var(--line); border-radius:10px; padding:12px 4px 8px; cursor:pointer; text-align:center; position:relative; }
  .fx-btn .fx-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin:0 auto 6px; }
  .fx-btn.on .fx-dot{ background:var(--amber); box-shadow:0 0 6px var(--amber); }
  .fx-btn.on{ background:#f7eede; border-color:var(--amber); }
  .fx-icon{ width:22px; height:22px; margin:0 auto 6px; }
  .fx-icon svg{ width:100%; height:100%; stroke:var(--ink); fill:none; stroke-width:1.6; }
  .fx-label{ font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:0.08em; color:var(--ink-dim); }

  /* timeline */
  .timeline-wrap{ position:relative; height:90px; background:#f4f0e5; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .timeline-wrap canvas{ width:100%; height:100%; display:block; }
  .playhead{ position:absolute; top:0; bottom:0; width:1px; background:var(--red); left:0; }
  .timeline-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.1em; }

  .footer{ margin-top:16px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.14em; color:var(--ink-faint); }
</style>
</head>
<body>
<div class="console">
  <div class="brand-row">
    <div>
      <div class="brand">LOOP CONSOLE</div>
      <div class="brand-sub">4-TRACK / CIRCUIT CLOCK SYNC</div>
    </div>
    <span class="led-mini" id="syncLed"></span>
  </div>
  <div class="hairline"></div>

  <div class="setup" id="setupPanel">
    <label for="midiSelect">MIDI入力(クロックのマスター)</label>
    <select id="midiSelect" disabled><option>権限を許可してください</option></select>
    <label for="audioInSelect">オーディオ入力</label>
    <select id="audioInSelect" disabled><option>権限を許可してください</option></select>
    <label for="audioOutSelect">オーディオ出力</label>
    <select id="audioOutSelect" disabled><option>権限を許可してください</option></select>
    <div style="height:6px;"></div>
    <button class="btn-slab" id="btnGrant">デバイスへのアクセスを許可</button>
    <button class="btn-slab hidden" id="btnConnect" style="margin-top:10px;">この設定で接続する</button>
    <div class="error hidden" id="errorLine"></div>
  </div>

  <div class="hidden" id="performPanel">
    <div class="main-grid">
      <div class="card">
        <div class="lcd">
          <span class="lcd-time" id="lcdTime">0:00:00</span>
          <span class="lcd-tag" id="lcdTag">READY</span>
        </div>
        <div class="dial-wrap">
          <svg class="dial-svg" viewBox="0 0 100 100">
            <circle class="dial-face" cx="50" cy="50" r="46"></circle>
            <line class="dial-cross" x1="50" y1="6" x2="50" y2="14" stroke="var(--line)"></line>
            <line class="dial-cross" x1="50" y1="86" x2="50" y2="94" stroke="var(--line)"></line>
            <g id="dialTicks"></g>
            <circle id="dialProgress" class="dial-progress" cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
          </svg>
          <div class="dial-center">
            <div class="dial-track-label" id="dialTrackLabel">TRACK A</div>
            <div class="dial-bpm" id="bpmNum">---</div>
            <div class="dial-bpm-unit">BPM</div>
            <div class="dial-pos" id="posLabel">BAR – / – ・ BEAT –</div>
          </div>
        </div>
        <div class="bars-row" id="barsSelect">
          <button data-bars="1">1</button>
          <button data-bars="2">2</button>
          <button data-bars="4" class="active">4</button>
          <button data-bars="8">8</button>
        </div>
        <div class="bars-caption">LOOP LENGTH (BARS) — SELECTED TRACK</div>
        <div class="state-line" id="stateLine">TRACK A 待機中 — REC で次の小節頭から録音</div>
        <div class="transport">
          <button class="deck-btn" id="btnRec" title="REC"><span class="deck-glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle></svg></span><span class="deck-label">REC</span></button>
          <button class="deck-btn" id="btnPlay" disabled title="PLAY"><span class="deck-glyph"><svg viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"></polygon></svg></span><span class="deck-label">PLAY</span></button>
          <button class="deck-btn" id="btnStop" disabled title="STOP"><span class="deck-glyph"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"></rect></svg></span><span class="deck-label">STOP</span></button>
          <button class="deck-btn" id="btnClear" disabled title="CLEAR"><span class="deck-glyph"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></span><span class="deck-label">CLEAR</span></button>
        </div>
        <div class="reset-row"><button id="btnResetBar">小節頭を今にリセット(手動同期)</button></div>
      </div>

      <div class="card">
        <h2>Track Select</h2>
        <div id="trackList"></div>
      </div>
    </div>

    <div style="height:16px;"></div>
    <div class="card">
      <h2>Effects (Master Bus)</h2>
      <div class="effects-grid" id="effectsGrid">
        <button class="fx-btn" data-fx="reverb"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="11"></circle></svg></div><div class="fx-label">REVERB</div></button>
        <button class="fx-btn" data-fx="delay"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><path d="M3 12h4M11 12h4M19 12h2"></path></svg></div><div class="fx-label">DELAY</div></button>
        <button class="fx-btn" data-fx="filter"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.4"></circle></svg></div><div class="fx-label">FILTER</div></button>
        <button class="fx-btn" data-fx="reverse"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><path d="M4 8l-2 4 2 4M20 8l2 4-2 4" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><div class="fx-label">REVERSE</div></button>
        <button class="fx-btn" data-fx="tape"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4"></circle><circle cx="17" cy="12" r="4"></circle></svg></div><div class="fx-label">TAPE</div></button>
      </div>
    </div>

    <div style="height:16px;"></div>
    <div class="card">
      <h2>Timeline — <span id="timelineTrackLabel">TRACK A</span></h2>
      <div class="timeline-wrap">
        <canvas id="waveCanvas"></canvas>
        <div class="playhead hidden" id="playhead"></div>
        <div class="timeline-empty" id="timelineEmpty">EMPTY</div>
      </div>
    </div>
  </div>

  <div class="footer">LOOP CONSOLE — PERSONAL BUILD</div>
</div>

<audio id="outputEl" autoplay></audio>

<script>
(() => {
  console.log('[SYNC LOOPER] Script init start');
  window.addEventListener('error', (e) => {
    console.error('[SYNC LOOPER] window error event:', e.message, e.error);
  });
  window.addEventListener('unhandledrejection', (e) => {
    console.error('[SYNC LOOPER] unhandled promise rejection:', e.reason);
  });
  try {
  const els = {
    midiSelect: document.getElementById('midiSelect'),
    audioInSelect: document.getElementById('audioInSelect'),
    audioOutSelect: document.getElementById('audioOutSelect'),
    btnGrant: document.getElementById('btnGrant'),
    btnConnect: document.getElementById('btnConnect'),
    errorLine: document.getElementById('errorLine'),
    setupPanel: document.getElementById('setupPanel'),
    performPanel: document.getElementById('performPanel'),
    syncLed: document.getElementById('syncLed'),
    lcdTime: document.getElementById('lcdTime'),
    lcdTag: document.getElementById('lcdTag'),
    bpmNum: document.getElementById('bpmNum'),
    posLabel: document.getElementById('posLabel'),
    dialTicks: document.getElementById('dialTicks'),
    dialProgress: document.getElementById('dialProgress'),
    dialTrackLabel: document.getElementById('dialTrackLabel'),
    barsSelect: document.getElementById('barsSelect'),
    stateLine: document.getElementById('stateLine'),
    btnRec: document.getElementById('btnRec'),
    btnPlay: document.getElementById('btnPlay'),
    btnStop: document.getElementById('btnStop'),
    btnClear: document.getElementById('btnClear'),
    btnResetBar: document.getElementById('btnResetBar'),
    outputEl: document.getElementById('outputEl'),
    trackList: document.getElementById('trackList'),
    effectsGrid: document.getElementById('effectsGrid'),
    waveCanvas: document.getElementById('waveCanvas'),
    playhead: document.getElementById('playhead'),
    timelineEmpty: document.getElementById('timelineEmpty'),
    timelineTrackLabel: document.getElementById('timelineTrackLabel'),
  };

  console.log('[SYNC LOOPER] DOM elements resolved:', els);
  const missingEls = Object.entries(els).filter(([key, val]) => !val).map(([key]) => key);
  if (missingEls.length){
    console.error('[SYNC LOOPER] Missing DOM elements:', missingEls);
    alert('[SYNC LOOPER] 初期化エラー: 以下のIDの要素が見つかりません -> ' + missingEls.join(', '));
  }

  const PPQ = 24;
  const PULSES_PER_BAR = PPQ * 4;

  let midiAccess = null, midiInput = null;
  let audioCtx = null, micStream = null, sourceNode = null, workletNode = null, destNode = null;
  let masterMix = null, filterNode = null, delayStage = null, reverbStage = null, tapeStage = null, masterGain = null;

  let clockTimestamps = [];
  let pulseCount = 0;
  let running = false;
  let recordedChunks = [];

  const fxState = { reverb:false, delay:false, filter:false, reverse:false, tape:false };

  const tracks = ['A','B','C','D'].map(id => ({
    id, bars:4, buffer:null, originalBuffer:null, reversed:false,
    source:null, state:'empty', recordTargetPulse:0, playStartTime:0
  }));
  let selectedId = 'A';
  const getSelected = () => tracks.find(t => t.id === selectedId);

  function showError(msg){
    els.errorLine.textContent = msg;
    els.errorLine.classList.remove('hidden');
  }

  // ---------- dial ticks ----------
  function buildTicks(){
    els.dialTicks.innerHTML = '';
    const bars = getSelected().bars;
    const total = bars * 4;
    for (let i = 0; i < total; i++){
      const angle = (i / total) * 2 * Math.PI;
      const isBarStart = i % 4 === 0;
      const rOuter = 46, rInner = isBarStart ? 40 : 42.5;
      const x1 = 50 + rOuter * Math.cos(angle), y1 = 50 + rOuter * Math.sin(angle);
      const x2 = 50 + rInner * Math.cos(angle), y2 = 50 + rInner * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'tick' + (isBarStart ? ' bar-start' : ''));
      els.dialTicks.appendChild(line);
    }
  }

  function updateDialProgress(){
    const t = getSelected();
    const total = t.bars * PULSES_PER_BAR;
    const pos = pulseCount % total;
    const frac = total ? pos / total : 0;
    els.dialProgress.setAttribute('stroke-dashoffset', String(100 - frac * 100));
    els.dialProgress.classList.remove('rec','play','armed');
    if (t.state === 'recording') els.dialProgress.classList.add('rec');
    else if (t.state === 'playing') els.dialProgress.classList.add('play');
    else if (t.state === 'rec-armed' || t.state === 'play-armed') els.dialProgress.classList.add('armed');

    const barIdx = Math.floor(pos / PULSES_PER_BAR) + 1;
    const beatIdx = Math.floor((pos % PULSES_PER_BAR) / PPQ) + 1;
    els.posLabel.textContent = `BAR ${barIdx}/${t.bars} ・ BEAT ${beatIdx}`;
    els.dialTrackLabel.textContent = `TRACK ${t.id}`;
  }

  // ---------- LCD timer ----------
  let timerInterval = null, timerStartMs = 0;
  function formatTime(ms){
    const totalCs = Math.floor(ms/10), cs = totalCs%100;
    const totalSec = Math.floor(totalCs/100), sec = totalSec%60, min = Math.floor(totalSec/60);
    return `${min}:${String(sec).padStart(2,'0')}:${String(cs).padStart(2,'0')}`;
  }
  function startTimer(){
    timerStartMs = performance.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { els.lcdTime.textContent = formatTime(performance.now()-timerStartMs); }, 30);
  }
  function freezeTimer(){ if (timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
  function resetTimerDisplay(){ freezeTimer(); els.lcdTime.textContent = '0:00:00'; }

  // ---------- setup / connect ----------
  console.log('[SYNC LOOPER] Attaching btnGrant click listener. Element:', els.btnGrant);
  els.btnGrant.addEventListener('click', async () => {
    console.log('[SYNC LOOPER] Button clicked');
    els.errorLine.classList.add('hidden');
    try{
      console.log('[SYNC LOOPER] getUserMedia start');
      const tempStream = await navigator.mediaDevices.getUserMedia({audio:true});
      console.log('[SYNC LOOPER] getUserMedia success', tempStream);
      tempStream.getTracks().forEach(t => t.stop());

      console.log('[SYNC LOOPER] enumerateDevices start');
      const devices = await navigator.mediaDevices.enumerateDevices();
      console.log('[SYNC LOOPER] enumerateDevices success. count=', devices.length, devices);
      const ins = devices.filter(d => d.kind === 'audioinput');
      const outs = devices.filter(d => d.kind === 'audiooutput');
      console.log('[SYNC LOOPER] audioinput count=', ins.length, 'audiooutput count=', outs.length);

      els.audioInSelect.innerHTML = ins.map(d => `<option value="${d.deviceId}">${d.label || 'マイク/入力'}</option>`).join('');
      els.audioOutSelect.innerHTML = outs.length ? outs.map(d => `<option value="${d.deviceId}">${d.label || '出力'}</option>`).join('') : '<option value="">既定の出力</option>';
      els.audioInSelect.disabled = false; els.audioOutSelect.disabled = false;
      console.log('[SYNC LOOPER] Audio select elements populated');

      if (!navigator.requestMIDIAccess){
        console.error('[SYNC LOOPER] navigator.requestMIDIAccess is not available in this browser');
        showError('このブラウザはWeb MIDI APIに対応していません。デスクトップ版Chromeをご利用ください。');
        return;
      }
      console.log('[SYNC LOOPER] requestMIDIAccess start');
      midiAccess = await navigator.requestMIDIAccess({sysex:false});
      console.log('[SYNC LOOPER] requestMIDIAccess success', midiAccess);
      const midiIns = Array.from(midiAccess.inputs.values());
      console.log('[SYNC LOOPER] MIDI input count=', midiIns.length, midiIns.map(m => m.name));
      if (midiIns.length === 0){
        showError('MIDI入力デバイスが見つかりません。Circuitを接続してから再度お試しください。');
      } else {
        els.midiSelect.innerHTML = midiIns.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        els.midiSelect.disabled = false;
      }
      els.btnGrant.classList.add('hidden'); els.btnConnect.classList.remove('hidden');
      console.log('[SYNC LOOPER] Setup flow complete. Connect button shown.');
    } catch(err){
      console.error('[SYNC LOOPER] Error during setup flow:', err.name, err.message, err);
      showError('権限の取得に失敗しました: ' + err.name + ' - ' + err.message);
      alert('[SYNC LOOPER] エラー発生: ' + err.name + ' - ' + err.message);
    }
  });
  console.log('[SYNC LOOPER] btnGrant click listener attached successfully');

  els.btnConnect.addEventListener('click', async () => {
    els.errorLine.classList.add('hidden');
    try{
      await connect();
      els.setupPanel.classList.add('hidden');
      els.performPanel.classList.remove('hidden');
      buildTicks(); updateDialProgress(); renderTrackList(); renderTimeline();
      requestAnimationFrame(playheadLoop);
    } catch(err){ showError('接続に失敗しました: ' + err.message); }
  });

  function makeStage(buildWetChain){
    const input = audioCtx.createGain();
    const dry = audioCtx.createGain(); dry.gain.value = 1;
    const wet = audioCtx.createGain(); wet.gain.value = 0;
    const output = audioCtx.createGain();
    input.connect(dry); dry.connect(output);
    const wetOut = buildWetChain(input);
    wetOut.connect(wet); wet.connect(output);
    return { input, output, setWet(w){ wet.gain.value = w; } };
  }
  function makeImpulse(ctx, duration, decay){
    const rate = ctx.sampleRate, length = Math.floor(rate*duration);
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for (let i=0;i<length;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay); }
    }
    return impulse;
  }
  function makeSaturationCurve(amount){
    const n = 4096, curve = new Float32Array(n), k = amount * 60 + 1;
    for (let i=0;i<n;i++){ const x = i*2/n - 1; curve[i] = (1+k)*x/(1+k*Math.abs(x)); }
    return curve;
  }

  async function connect(){
    const midiId = els.midiSelect.value;
    midiInput = midiAccess.inputs.get(midiId);
    if (!midiInput) throw new Error('MIDI入力を取得できません');
    midiInput.onmidimessage = onMidiMessage;

    const audioInId = els.audioInSelect.value;
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ deviceId: audioInId ? {exact:audioInId} : undefined, echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaStreamSource(micStream);

    const workletCode = `
      class RecorderProcessor extends AudioWorkletProcessor {
        process(inputs){
          const input = inputs[0];
          if (input && input.length > 0 && input[0].length > 0){
            this.port.postMessage(input.map(ch => ch.slice()));
          }
          return true;
        }
      }
      registerProcessor('recorder-processor', RecorderProcessor);
    `;
    const blobUrl = URL.createObjectURL(new Blob([workletCode], {type:'application/javascript'}));
    await audioCtx.audioWorklet.addModule(blobUrl);
    workletNode = new AudioWorkletNode(audioCtx, 'recorder-processor');
    workletNode.port.onmessage = (e) => {
      const t = getSelected();
      if (t.state === 'recording') recordedChunks.push(e.data);
    };
    sourceNode.connect(workletNode);

    // ---- effects bus ----
    masterMix = audioCtx.createGain();
    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.value = 20000;
    delayStage = makeStage((input) => {
      const delay = audioCtx.createDelay(1.5);
      delay.delayTime.value = 0.27;
      const fb = audioCtx.createGain(); fb.gain.value = 0.35;
      input.connect(delay); delay.connect(fb); fb.connect(delay);
      return delay;
    });
    reverbStage = makeStage((input) => {
      const conv = audioCtx.createConvolver();
      conv.buffer = makeImpulse(audioCtx, 2.2, 3.2);
      input.connect(conv);
      return conv;
    });
    tapeStage = makeStage((input) => {
      const shaper = audioCtx.createWaveShaper();
      shaper.curve = makeSaturationCurve(0.35);
      shaper.oversample = '4x';
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5500;
      input.connect(shaper); shaper.connect(lp);
      return lp;
    });
    masterGain = audioCtx.createGain();

    masterMix.connect(filterNode);
    filterNode.connect(delayStage.input);
    delayStage.output.connect(reverbStage.input);
    reverbStage.output.connect(tapeStage.input);
    tapeStage.output.connect(masterGain);

    destNode = audioCtx.createMediaStreamDestination();
    masterGain.connect(destNode);
    els.outputEl.srcObject = destNode.stream;
    const audioOutId = els.audioOutSelect.value;
    if (audioOutId && typeof els.outputEl.setSinkId === 'function'){
      try { await els.outputEl.setSinkId(audioOutId); } catch(e){ showError('出力デバイスの指定に失敗しました。既定の出力を使用します。'); }
    }
    await els.outputEl.play().catch(()=>{});
  }

  // ---------- MIDI clock ----------
  function onMidiMessage(e){
    const status = e.data[0];
    if (status === 0xF8) handleClockPulse();
    else if (status === 0xFA){ pulseCount = 0; running = true; setSyncUI(true); }
    else if (status === 0xFB){ running = true; setSyncUI(true); }
    else if (status === 0xFC){ running = false; }
  }
  function setSyncUI(on){ els.syncLed.classList.toggle('on', on); }

  function handleClockPulse(){
    const now = performance.now();
    clockTimestamps.push(now);
    if (clockTimestamps.length > 48) clockTimestamps.shift();
    updateBpm();
    if (!running){ running = true; setSyncUI(true); }
    pulseCount++;

    for (const t of tracks){
      const posInBar = pulseCount % PULSES_PER_BAR;
      if (t.state === 'rec-armed' && posInBar === 0){
        startRecording(t);
      } else if (t.state === 'recording' && pulseCount >= t.recordTargetPulse){
        stopRecordingAndPlay(t);
      } else if (t.state === 'play-armed' && posInBar === 0){
        startPlayback(t);
      }
    }
    updateDialProgress();
  }

  function updateBpm(){
    if (clockTimestamps.length < 2) return;
    let sum = 0;
    for (let i=1;i<clockTimestamps.length;i++) sum += clockTimestamps[i]-clockTimestamps[i-1];
    const avg = sum/(clockTimestamps.length-1);
    const bpm = 60000/(avg*PPQ);
    if (isFinite(bpm)) els.bpmNum.textContent = bpm.toFixed(1);
  }

  // ---------- bars ----------
  els.barsSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-bars]');
    const t = getSelected();
    if (!btn || t.state !== 'empty') return;
    t.bars = parseInt(btn.dataset.bars, 10);
    [...els.barsSelect.children].forEach(b => b.classList.toggle('active', b === btn));
    buildTicks(); updateDialProgress();
  });

  // ---------- recording / playback per track ----------
  function startRecording(t){
    recordedChunks = [];
    t.state = 'recording';
    t.recordTargetPulse = pulseCount + t.bars * PULSES_PER_BAR;
    updateTransportUI(); renderTrackList();
    els.stateLine.textContent = `TRACK ${t.id} 録音中 — ${t.bars}小節`;
    els.lcdTag.textContent = 'REC';
    startTimer();
  }

  function stopRecordingAndPlay(t){
    if (t.id === selectedId) freezeTimer();
    const chunks = recordedChunks;
    recordedChunks = [];
    if (chunks.length === 0){
      t.state = 'empty';
      updateTransportUI(); renderTrackList();
      if (t.id === selectedId){ els.stateLine.textContent = '録音データがありませんでした。入力レベルを確認してください。'; els.lcdTag.textContent = 'READY'; }
      return;
    }
    const numChannels = chunks[0].length;
    const sampleRate = audioCtx.sampleRate;
    const totalLength = chunks.reduce((sum,c) => sum + c[0].length, 0);
    const buffer = audioCtx.createBuffer(numChannels, totalLength, sampleRate);
    for (let ch=0; ch<numChannels; ch++){
      const data = buffer.getChannelData(ch);
      let offset = 0;
      for (const c of chunks){ data.set(c[ch], offset); offset += c[ch].length; }
    }
    t.buffer = buffer;
    t.originalBuffer = buffer;
    t.reversed = false;
    startPlayback(t);
    renderTrackList();
    if (t.id === selectedId) renderTimeline();
  }

  function startPlayback(t){
    if (!t.buffer) return;
    if (t.source){ try{ t.source.stop(); }catch(e){} }
    const src = audioCtx.createBufferSource();
    src.buffer = t.buffer;
    src.loop = true;
    src.connect(masterMix);
    src.start();
    t.source = src;
    t.playStartTime = audioCtx.currentTime;
    t.state = 'playing';
    updateTransportUI(); renderTrackList();
    if (t.id === selectedId){
      els.stateLine.textContent = `TRACK ${t.id} ループ再生中`;
      els.lcdTag.textContent = 'PLAY';
      els.lcdTime.textContent = formatTime(t.buffer.duration*1000);
    }
  }

  function stopPlayback(t){
    if (t.source){ try{ t.source.stop(); }catch(e){} t.source = null; }
    t.state = 'stopped';
    updateTransportUI(); renderTrackList();
    if (t.id === selectedId){ els.stateLine.textContent = `TRACK ${t.id} 停止中 — PLAYで再生 / CLEARで削除`; els.lcdTag.textContent = 'STOP'; }
  }

  // ---------- transport ----------
  els.btnRec.addEventListener('click', () => {
    const t = getSelected();
    if (t.state === 'rec-armed'){ t.state = t.buffer ? 'stopped' : 'empty'; updateTransportUI(); renderTrackList(); els.stateLine.textContent = `TRACK ${t.id} 待機中 — REC で次の小節頭から録音`; els.lcdTag.textContent = 'READY'; return; }
    if (!(t.state === 'empty' || t.state === 'stopped')) return;
    if (!running){ showError('MIDIクロックを受信していません。Circuitを再生状態にしてください。'); return; }
    if (t.state === 'stopped') stopPlayback(t);
    t.state = 'rec-armed';
    updateTransportUI(); renderTrackList();
    els.stateLine.textContent = `TRACK ${t.id} 録音待機中 — 次の小節頭で開始します`;
    els.lcdTag.textContent = 'ARMED';
  });

  els.btnPlay.addEventListener('click', () => {
    const t = getSelected();
    if (t.state === 'play-armed'){ t.state = 'stopped'; updateTransportUI(); renderTrackList(); return; }
    if (t.state !== 'stopped') return;
    if (running){
      t.state = 'play-armed';
      updateTransportUI(); renderTrackList();
      els.stateLine.textContent = `TRACK ${t.id} 再生待機中 — 次の小節頭で開始します`;
    } else {
      startPlayback(t);
    }
  });

  els.btnStop.addEventListener('click', () => {
    const t = getSelected();
    if (t.state === 'playing') stopPlayback(t);
  });

  els.btnClear.addEventListener('click', () => {
    const t = getSelected();
    if (t.source){ try{ t.source.stop(); }catch(e){} t.source = null; }
    t.buffer = null; t.originalBuffer = null; t.reversed = false;
    t.state = 'empty';
    if (t.id === selectedId) resetTimerDisplay();
    updateTransportUI(); renderTrackList(); renderTimeline();
    els.stateLine.textContent = `TRACK ${t.id} 待機中 — REC で次の小節頭から録音`;
    els.lcdTag.textContent = 'READY';
  });

  els.btnResetBar.addEventListener('click', () => { pulseCount = 0; updateDialProgress(); });

  function updateTransportUI(){
    const t = getSelected();
    els.btnRec.classList.toggle('armed', t.state === 'rec-armed');
    els.btnRec.classList.toggle('recording', t.state === 'recording');
    els.btnRec.disabled = (t.state === 'recording');
    els.btnPlay.classList.toggle('armed', t.state === 'play-armed');
    els.btnPlay.classList.toggle('playing', t.state === 'playing');
    els.btnPlay.disabled = !(t.state === 'stopped' || t.state === 'play-armed');
    els.btnStop.disabled = (t.state !== 'playing');
    els.btnClear.disabled = !(t.buffer || t.state === 'recording' || t.state === 'rec-armed');
    [...els.barsSelect.children].forEach(b => {
      b.disabled = (t.state !== 'empty');
      b.classList.toggle('active', parseInt(b.dataset.bars,10) === t.bars);
    });
    document.getElementById('fx-reverse-check');
  }

  // ---------- track list UI ----------
  function trackMiniBars(t){
    if (!t.buffer){ return Array.from({length:8}, () => `<span></span>`).join(''); }
    const data = t.buffer.getChannelData(0);
    const step = Math.floor(data.length/8) || 1;
    let out = '';
    for (let i=0;i<8;i++){
      let peak = 0;
      const start = i*step;
      for (let j=0;j<step;j++){ const v = Math.abs(data[start+j] || 0); if (v>peak) peak = v; }
      const h = Math.max(15, Math.min(100, peak*140));
      out += `<span class="filled" style="height:${h}%"></span>`;
    }
    return out;
  }

  function renderTrackList(){
    els.trackList.innerHTML = tracks.map(t => {
      const dotClass = t.state === 'recording' ? 'rec' : t.state === 'playing' ? 'play' : (t.state==='rec-armed'||t.state==='play-armed') ? 'armed' : '';
      const dur = t.buffer ? formatTime(t.buffer.duration*1000) : '--:--';
      const label = t.buffer ? `LOOP ${t.id}${t.reversed ? ' (REV)' : ''}` : 'EMPTY';
      return `
        <div class="track-row ${t.id===selectedId?'selected':''}" data-track="${t.id}">
          <span class="track-radio"></span>
          <span class="track-letter">${t.id}</span>
          <div class="track-body">
            <div class="track-mini-bars">${trackMiniBars(t)}</div>
            <div class="track-meta">
              <span><span class="track-state-dot ${dotClass}"></span> ${label}</span>
              <span>${dur}</span>
            </div>
          </div>
        </div>`;
    }).join('');
    [...els.trackList.querySelectorAll('.track-row')].forEach(row => {
      row.addEventListener('click', () => {
        selectedId = row.dataset.track;
        buildTicks(); updateDialProgress(); updateTransportUI(); renderTrackList(); renderTimeline();
        const t = getSelected();
        els.timelineTrackLabel.textContent = `TRACK ${t.id}`;
        if (t.state === 'playing'){ els.stateLine.textContent = `TRACK ${t.id} ループ再生中`; els.lcdTag.textContent = 'PLAY'; }
        else if (t.state === 'stopped'){ els.stateLine.textContent = `TRACK ${t.id} 停止中 — PLAYで再生 / CLEARで削除`; els.lcdTag.textContent = 'STOP'; }
        else { els.stateLine.textContent = `TRACK ${t.id} 待機中 — REC で次の小節頭から録音`; els.lcdTag.textContent = 'READY'; }
      });
    });
  }

  // ---------- effects ----------
  els.effectsGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.fx-btn');
    if (!btn) return;
    const fx = btn.dataset.fx;
    fxState[fx] = !fxState[fx];
    btn.classList.toggle('on', fxState[fx]);
    applyFx(fx);
  });

  function applyFx(fx){
    if (!audioCtx) return;
    if (fx === 'reverb') reverbStage.setWet(fxState.reverb ? 0.28 : 0);
    if (fx === 'delay') delayStage.setWet(fxState.delay ? 0.3 : 0);
    if (fx === 'tape') tapeStage.setWet(fxState.tape ? 0.5 : 0);
    if (fx === 'filter') filterNode.frequency.setTargetAtTime(fxState.filter ? 1400 : 20000, audioCtx.currentTime, 0.02);
    if (fx === 'reverse') applyReverseToSelected();
  }

  function reverseBuffer(buffer){
    const rev = audioCtx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
    for (let ch=0; ch<buffer.numberOfChannels; ch++){
      const src = buffer.getChannelData(ch), dst = rev.getChannelData(ch);
      for (let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
    }
    return rev;
  }

  function applyReverseToSelected(){
    const t = getSelected();
    if (!t.buffer) return;
    t.reversed = fxState.reverse;
    t.buffer = t.reversed ? reverseBuffer(t.originalBuffer) : t.originalBuffer;
    if (t.state === 'playing') startPlayback(t);
    renderTrackList(); renderTimeline();
  }

  // ---------- timeline waveform ----------
  function renderTimeline(){
    const t = getSelected();
    els.timelineTrackLabel.textContent = `TRACK ${t.id}`;
    const canvas = els.waveCanvas;
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    canvas.width = cw*dpr; canvas.height = ch*dpr;
    const ctx2d = canvas.getContext('2d');
    ctx2d.setTransform(dpr,0,0,dpr,0,0);
    ctx2d.clearRect(0,0,cw,ch);

    if (!t.buffer){ els.timelineEmpty.classList.remove('hidden'); els.playhead.classList.add('hidden'); return; }
    els.timelineEmpty.classList.add('hidden');

    const data = t.buffer.getChannelData(0);
    const step = Math.ceil(data.length/cw);
    const mid = ch/2;
    ctx2d.fillStyle = '#8a8271';
    for (let x=0; x<cw; x++){
      let min=1, max=-1;
      const start = x*step;
      for (let i=0;i<step;i++){
        const idx = start+i;
        if (idx >= data.length) break;
        const v = data[idx];
        if (v<min) min=v;
        if (v>max) max=v;
      }
      if (min>max){ min=0; max=0; }
      const y1 = mid + min*mid*0.85, y2 = mid + max*mid*0.85;
      ctx2d.fillRect(x, Math.min(y1,y2), 1, Math.max(1, Math.abs(y2-y1)));
    }
    // bar ticks
    ctx2d.strokeStyle = '#c1b9a6';
    ctx2d.lineWidth = 1;
    const barDur = (60/parseFloat(els.bpmNum.textContent || 120))*4;
    if (barDur > 0 && isFinite(barDur)){
      const barCount = Math.round(t.buffer.duration / barDur);
      for (let b=0; b<=barCount; b++){
        const x = Math.round((b*barDur/t.buffer.duration) * cw);
        ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,ch); ctx2d.stroke();
      }
    }
  }

  function playheadLoop(){
    const t = getSelected();
    if (t.buffer && t.state === 'playing' && audioCtx){
      const dur = t.buffer.duration;
      const phase = ((audioCtx.currentTime - t.playStartTime) % dur + dur) % dur;
      const cw = els.waveCanvas.clientWidth;
      els.playhead.style.left = (phase/dur*cw) + 'px';
      els.playhead.classList.remove('hidden');
    } else {
      els.playhead.classList.add('hidden');
    }
    requestAnimationFrame(playheadLoop);
  }

  updateTransportUI();
  renderTrackList();
  console.log('[SYNC LOOPER] Initial render complete. App ready.');
  } catch (initErr) {
    console.error('[SYNC LOOPER] Fatal init error (script aborted):', initErr);
    alert('[SYNC LOOPER] 初期化に失敗しました: ' + initErr.name + ' - ' + initErr.message);
  }
})();
</script>
</body>
</html>
