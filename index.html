<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOP CONSOLE</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c9862f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* グレーベースの東独工業機器風パレット。
       灰色の筐体に、信号色は彩度を落として最小限だけ使う */
    --bg:#7d817c;
    --body-a:#cbcec9;
    --body-b:#b4b8b3;
    --panel:#c1c4bf;
    --sunk:#b0b3ae;        /* 一段沈んだ面 */
    --shell-edge:#8d918c;
    --ink:#1e2124;
    --ink-dim:#5d625f;
    --ink-faint:#8b8f8b;
    --line:#a0a49f;
    --screen-bg:#0f120e;
    --screen-fg:#7fd08a;   /* 蛍光表示管の緑 */
    --red:#9c3a2b;
    --green:#4a7a4f;
    --amber:#ad7f2b;
    /* トラック識別色(グレー基調に馴染むよう彩度を落とした信号色) */
    --track-a:#9c3a2b;
    --track-b:#4a7a4f;
    --track-c:#8a6a35;
    --track-d:#4c6379;
    --active-track-color:var(--track-a);
    /* 余白と角丸を一定にするためのトークン */
    --gap:12px;
    --pad:14px;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg, #8a8e89 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    display:flex;
    justify-content:center;
    padding:20px 14px 64px;
  }
  .console{
    width:100%;
    max-width:880px;
    background:linear-gradient(170deg, var(--body-a) 0%, var(--body-b) 100%);
    border:1px solid var(--shell-edge);
    border-radius:var(--radius);
    padding:var(--pad);
    box-shadow:0 18px 40px -20px rgba(20,24,20,0.55), inset 0 1px 0 rgba(255,255,255,0.45);
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--gap); flex-wrap:wrap; row-gap:8px; }
  .brand{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; }
  .brand-sub{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.18em; color:var(--ink-dim); margin-top:2px; }
  .brand-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:8px; justify-content:flex-end; }
  .sync-mode-badge{ font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:0.1em; color:var(--ink-dim); background:var(--sunk); border:1px solid var(--line); border-radius:4px; padding:2px 6px; }
  .led-mini{ width:7px;height:7px;border-radius:50%; background:var(--red); opacity:0.25; transition:opacity .15s, box-shadow .15s; }
  .led-mini.on{ opacity:1; box-shadow:0 0 6px var(--red); }
  .learn-toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.1em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--sunk);
    color:var(--ink-dim);
    cursor:pointer;
  }
  .learn-toggle.on{
    background:var(--amber);
    color:#2a1a06;
    border-color:var(--amber);
    animation:learnpulse 1s ease-in-out infinite;
  }
  @keyframes learnpulse{ 50%{ opacity:0.7; } }
  .panic-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:8px;
    letter-spacing:0.08em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--red);
    background:var(--red);
    color:#fff;
    cursor:pointer;
    font-weight:700;
  }
  .panic-btn:active{ background:#8f2a20; border-color:#8f2a20; }
  .fullscreen-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.1em;
    padding:5px 9px;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--sunk);
    color:var(--ink-dim);
    cursor:pointer;
  }
  .fullscreen-btn.on{
    background:var(--ink);
    color:var(--body-a);
    border-color:var(--ink);
  }
  .learn-status{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:#8a5a1c;
    background:var(--sunk);
    border:1px solid var(--amber);
    border-radius:var(--radius);
    padding:6px 10px;
    margin-bottom:var(--gap);
  }
  .hairline{ height:1px; background:var(--line); opacity:0.6; margin:var(--gap) 0; }
  .hidden{ display:none !important; }

  /* setup */
  .setup label{ display:block; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; }
  .setup select, .setup input[type="number"]{ width:100%; padding:10px; margin-bottom:12px; background:var(--sunk); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius); font-family:'Noto Sans JP', sans-serif; font-size:13px; }
  .mode-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .mode-toggle button{ flex:1; padding:10px; border-radius:var(--radius); border:1px solid var(--line); background:var(--sunk); color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.04em; cursor:pointer; }
  .mode-toggle button.active{ background:var(--ink); color:var(--body-a); border-color:var(--ink); }
  .btn-slab{ width:100%; cursor:pointer; padding:14px; border-radius:var(--radius); border:1px solid var(--shell-edge); background:linear-gradient(180deg,var(--body-a),var(--body-b)); color:var(--ink); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; box-shadow:0 2px 0 rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.7); }
  .btn-slab:active{ transform:translateY(1px); }
  .error{ color:var(--red); font-size:11px; margin-top:10px; font-family:'JetBrains Mono', monospace; }

  /* main grid */
  #performPanel{ display:flex; flex-direction:column; gap:var(--gap); }
  .main-grid{ display:grid; grid-template-columns:1fr; gap:var(--gap); align-items:start; }
  .lower-grid{ display:grid; grid-template-columns:1fr; gap:var(--gap); align-items:start; }
  .side-col{ display:flex; flex-direction:column; gap:var(--gap); }
  @media (min-width:720px){ .main-grid{ grid-template-columns:0.95fr 1.05fr; } }

  /* ワイド画面: コンソールを広げ、下段の2カードを横並びにして
     スクロールせずに全体が見えるようにする */
  @media (min-width:1200px){
    .console{ max-width:1200px; }
    .lower-grid{ grid-template-columns:1fr 1fr; }
    /* 画面が広い分ダイヤルを大きくし、離れた位置からも読めるようにする */
    .dial-wrap{ width:250px; height:250px; }
    .dial-bpm{ font-size:34px; }
  }
  @media (min-width:1600px){
    .console{ max-width:1360px; }
    .dial-wrap{ width:280px; height:280px; }
    .dial-bpm{ font-size:38px; }
  }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); }
  .card h2{ margin:0 0 var(--gap); font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.16em; color:var(--ink-dim); text-transform:uppercase; }
  .card.collapsible{ padding:var(--pad); }
  .card.collapsible summary{
    margin:0; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.16em;
    color:var(--ink-dim); text-transform:uppercase; cursor:pointer; list-style:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  .card.collapsible summary::-webkit-details-marker{ display:none; }
  .card.collapsible summary::after{ content:'▸'; font-size:10px; transition:transform .15s ease; }
  .card.collapsible[open] summary::after{ transform:rotate(90deg); }
  .card.collapsible[open] summary{ margin-bottom:var(--gap); }
  .card.collapsible[open] > *:not(summary){ margin-top:0; }

  .lcd{ background:var(--screen-bg); border-radius:var(--radius); padding:9px 13px; display:flex; align-items:baseline; justify-content:space-between; box-shadow:inset 0 2px 6px rgba(0,0,0,0.6); margin-bottom:var(--gap); }
  .lcd-time{ font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--screen-fg); letter-spacing:0.05em; text-shadow:0 0 8px rgba(111,199,255,0.5); font-variant-numeric:tabular-nums; }
  .lcd-tag{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--screen-fg); opacity:0.7; letter-spacing:0.14em; }

  .dial-row{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .dial-wrap{ position:relative; width:210px; height:210px; }
  /* 4拍のフラッシュメトロノーム。角型ランプが上から順に光る */
  .metro{ display:flex; flex-direction:column; gap:8px; flex:none; }
  .metro-lamp{
    width:17px; height:17px; border-radius:2px;
    border:1px solid var(--shell-edge);
    background:var(--sunk);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.4);
    transition:background .04s linear, box-shadow .04s linear;
  }
  .metro-lamp.on{
    background:linear-gradient(180deg,#e0c78a,#b5892f);
    box-shadow:0 0 9px rgba(181,137,47,0.85), inset 0 1px 0 rgba(255,255,255,0.45);
  }
  /* 1拍目だけ赤く強調する */
  .metro-lamp.on.accent{
    background:linear-gradient(180deg,#d97a68,#9c3a2b);
    box-shadow:0 0 11px rgba(156,58,43,0.9), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .dial-svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .dial-face{ fill:var(--sunk); stroke:var(--line); stroke-width:1; }
  .dial-progress{ fill:none; stroke:var(--ink-dim); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset .05s linear, stroke .2s ease; }
  .dial-progress.rec{ stroke:var(--red); }
  .dial-progress.play{ stroke:var(--green); }
  .dial-progress.armed{ stroke:var(--amber); }
  /* 外周の輪: 最大小節数(8小節)のうち今どこかを示す */
  .dial-overall-track{ fill:none; stroke:var(--line); stroke-width:2; opacity:0.55; }
  .dial-overall{ fill:none; stroke:var(--ink-dim); stroke-width:2; stroke-linecap:butt; opacity:0.85; transition:stroke-dashoffset .05s linear; }
  .tick{ stroke:var(--ink-dim); stroke-width:1; opacity:0.5; }
  .tick.bar-start{ stroke:var(--ink); stroke-width:1.6; opacity:0.85; }
  .dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .dial-track-label{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); letter-spacing:0.1em; margin-bottom:4px; }
  .dial-bpm{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:30px; line-height:1; }
  .dial-bpm-edit{ display:flex; align-items:center; gap:6px; pointer-events:auto; }
  .bpm-step{ pointer-events:auto; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:var(--sunk); color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-size:14px; cursor:pointer; line-height:1; }
  .bpm-input{ width:70px; text-align:center; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:26px; border:none; border-bottom:1px dashed var(--line); background:transparent; color:var(--ink); pointer-events:auto; }
  .bpm-input::-webkit-outer-spin-button, .bpm-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .dial-bpm-unit{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.2em; margin-top:3px; }
  .tap-btn{ pointer-events:auto; margin-top:6px; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.12em; padding:4px 12px; border-radius:var(--radius); border:1px solid var(--line); background:var(--sunk); color:var(--ink-dim); cursor:pointer; }
  .tap-btn:active{ background:var(--amber); color:#2a1a06; }
  .dial-pos{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); margin-top:7px; }

  .bars-row{ display:flex; gap:6px; justify-content:center; margin:var(--gap) 0 4px; }
  .bars-row button{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--sunk); color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; cursor:pointer; }
  .bars-row button.active{ background:var(--ink); color:var(--body-a); border-color:var(--ink); }
  .bars-row button:disabled{ opacity:0.4; cursor:not-allowed; }
  .bars-caption{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.14em; margin-bottom:var(--gap); }

  .state-line{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); margin-bottom:var(--gap); min-height:14px; }

  .transport{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .deck-btn{
    position:relative; aspect-ratio:1; border-radius:var(--radius);
    border:1px solid var(--shell-edge);
    background:linear-gradient(180deg,var(--body-a),var(--body-b));
    box-shadow:0 2px 0 rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.45);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    transition:background .12s, color .12s;
  }
  .deck-btn:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,0.18), inset 0 1px 3px rgba(0,0,0,0.3); }
  .deck-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .deck-glyph{ width:16px; height:16px; }
  .deck-glyph svg{ width:100%; height:100%; }
  /* ラベルはボタン中央の主役。刻印風に少し沈ませる */
  .deck-label{
    font-family:'JetBrains Mono', monospace; font-weight:700;
    font-size:13px; letter-spacing:0.16em; color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,0.35);
  }

  /* REC: 赤い押しボタン */
  #btnRec{ background:linear-gradient(180deg,#b8483a,#8e3125); border-color:#7a2a20; }
  #btnRec .deck-label{ color:#f2e4e1; text-shadow:0 1px 1px rgba(0,0,0,0.45); }
  #btnRec .deck-glyph circle{ fill:#f2e4e1; }
  #btnRec.armed{ animation:blinkrec 0.6s step-start infinite; }
  @keyframes blinkrec{ 50%{ background:linear-gradient(180deg,#d9604f,#a63c2d); } }
  #btnRec.recording{ background:linear-gradient(180deg,#d9604f,#a63c2d); box-shadow:0 0 12px rgba(184,72,58,0.55), inset 0 1px 0 rgba(255,255,255,0.25); }

  /* PLAY: 少し見慣れない青緑寄りの緑 */
  #btnPlay{ background:linear-gradient(180deg,#4f8271,#33604f); border-color:#2b5243; }
  #btnPlay .deck-label{ color:#e2efe8; text-shadow:0 1px 1px rgba(0,0,0,0.4); }
  #btnPlay .deck-glyph polygon{ fill:#e2efe8; }
  #btnPlay.armed{ animation:blinkplay 0.6s step-start infinite; }
  @keyframes blinkplay{ 50%{ background:linear-gradient(180deg,#68a189,#3f7561); } }
  #btnPlay.playing{ background:linear-gradient(180deg,#68a189,#3f7561); box-shadow:0 0 12px rgba(79,130,113,0.5), inset 0 1px 0 rgba(255,255,255,0.25); }

  /* STOP: 無彩色の重い押しボタン */
  #btnStop{ background:linear-gradient(180deg,#6f736f,#4d514e); border-color:#42463f; }
  #btnStop .deck-label{ color:#e6e8e4; text-shadow:0 1px 1px rgba(0,0,0,0.4); }
  #btnStop .deck-glyph rect{ fill:#e6e8e4; }
  #btnStop.armed{ animation:blinkstop 0.6s step-start infinite; }
  @keyframes blinkstop{ 50%{ background:linear-gradient(180deg,#8b8f8a,#5f635f); } }

  /* CLEAR: くしゃくしゃの紙。SVGのタービュレンス+拡散光で皺の凹凸を作る
     (外部画像を使わず、これ1枚で不規則な折り目になる) */
  #btnClear{
    border-color:var(--shell-edge);
    background-color:#c4c7c2;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='cr'><feTurbulence type='fractalNoise' baseFrequency='0.045' numOctaves='5' seed='11' result='n'/><feDiffuseLighting in='n' lighting-color='%23d8dbd6' surfaceScale='2.4'><feDistantLight azimuth='118' elevation='52'/></feDiffuseLighting></filter><rect width='160' height='160' filter='url(%23cr)'/></svg>");
    background-size:cover;
    background-blend-mode:multiply;
  }
  #btnClear .deck-label{ color:var(--ink); }
  #btnClear .deck-glyph line{ stroke:var(--ink); }

  /* チューナー */
  .tuner{ margin-top:var(--gap); display:flex; flex-direction:column; align-items:center; gap:7px; }
  .toggle-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 18px; }
  .tuner-readout{ width:100%; max-width:300px; }
  .tuner-meter{ position:relative; height:10px; background:var(--sunk); border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .tuner-meter::before{ content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--green); opacity:0.9; }
  .tuner-needle{ position:absolute; top:0; bottom:0; width:3px; background:var(--amber); left:50%; transform:translateX(-50%); transition:left .08s linear, background .15s; }
  .tuner-needle.in-tune{ background:var(--green); }
  .tuner-info{ display:flex; align-items:baseline; justify-content:center; gap:10px; margin-top:4px; font-family:'JetBrains Mono', monospace; }
  .tuner-note{ font-size:18px; font-weight:700; color:var(--ink); min-width:46px; text-align:right; }
  .tuner-cents{ font-size:10px; color:var(--ink-dim); min-width:52px; }
  .tuner-hz{ font-size:9px; color:var(--ink-faint); }

  .reset-row{ text-align:center; margin-top:var(--gap); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .reset-row button{ background:none; border:none; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); text-decoration:underline; }
  /* 東欧の工業機器風トグルスイッチ。0(切) / I(入) の刻印つき */
  .sw{ position:relative; display:inline-block; width:42px; height:20px; flex:none; vertical-align:middle; }
  .sw input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; z-index:2; }
  .sw-track{
    position:absolute; inset:0; border:1px solid var(--shell-edge); border-radius:2px;
    background:linear-gradient(180deg,#9fa39e,#b7bab5);
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.38);
    transition:background .12s;
  }
  /* 筐体側の刻印。ノブに隠れないよう両脇に置く */
  .sw-group{ display:inline-flex; align-items:center; gap:5px; }
  .sw-mark{ font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; color:var(--ink-faint); line-height:1; }
  .sw-group:has(input:checked) .sw-mark-on{ color:var(--amber); }
  .sw-group:has(input:not(:checked)) .sw-mark-off{ color:var(--ink-dim); }
  .sw-knob{
    position:absolute; top:2px; left:2px; width:18px; height:14px; z-index:1;
    border:1px solid #6f736e; border-radius:1px;
    background:linear-gradient(180deg,#eceee9 0%,#c6cac4 55%,#a9ada7 100%);
    box-shadow:0 1px 2px rgba(0,0,0,0.45);
    transition:left .12s ease, background .12s;
  }
  /* 指かかりの溝 */
  .sw-knob::after{
    content:''; position:absolute; top:3px; bottom:3px; left:6px; width:5px;
    border-left:1px solid rgba(0,0,0,0.28); border-right:1px solid rgba(0,0,0,0.28);
  }
  .sw input:checked ~ .sw-knob{ left:20px; background:linear-gradient(180deg,#f0e2bd 0%,#d3b168 55%,#b5892f 100%); border-color:#8a6721; }
  .sw input:checked ~ .sw-track{ background:linear-gradient(180deg,#7d7a5f,#95927a); }
  .sw input:focus-visible ~ .sw-track{ outline:1px solid var(--amber); outline-offset:1px; }

  .cal-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 14px; }
  .latency-cal{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.06em; color:var(--ink-dim); display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
  .latency-cal input[type="number"]{ width:54px; padding:3px 5px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--sunk); color:var(--ink); }

  /* track select */
  .track-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .track-row:last-child{ border-bottom:none; }
  .track-radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-faint); flex:none; position:relative; }
  .track-row.selected .track-radio{ border-color:var(--track-color, var(--ink-dim)); }
  .track-row.selected .track-radio::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--track-color, var(--ink-dim)); }
  .track-letter{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; width:20px; flex:none; color:var(--track-color, var(--ink)); }
  .track-body{ flex:1; min-width:0; }
  /* 常に8小節ぶんの固定の物差し。ループの切れ目に縦線を入れて周回が見えるようにする */
  .track-mini-bars{
    position:relative; display:flex; gap:0; height:20px; align-items:flex-end; margin-bottom:5px;
    padding:0 1px;
  }
  /* ループ1周ごとに枠を描く。小節数がひと目で分かるようにするため。
     バーの背面だと波形に隠れるので ::after で上に重ねる */
  .track-mini-bars::after{
    content:''; position:absolute; inset:-2px 0; z-index:1; pointer-events:none;
    border:1px solid rgba(28,31,34,0.45);
    background-image:repeating-linear-gradient(90deg,
      rgba(28,31,34,0.45) 0 1px, transparent 1px var(--loop-pct, 100%));
  }
  .track-mini-bars span{ flex:1; background:var(--ink-faint); border-radius:1px; min-height:2px; opacity:0.5; }
  .track-mini-bars span.filled{ background:var(--track-color, var(--ink-dim)); opacity:1; }
  /* トラックセレクト上の再生ヘッド(8小節グリッド上の現在位置) */
  .track-playhead{
    position:absolute; top:-2px; bottom:-2px; left:0; width:1px;
    background:var(--red); opacity:0; pointer-events:none; z-index:2;
    box-shadow:0 0 4px var(--red);
  }
  .track-playhead.on{ opacity:0.95; }
  .track-meta{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); }
  .track-state-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .track-state-dot.rec{ background:var(--red); box-shadow:0 0 5px var(--red); }
  .track-state-dot.play{ background:var(--green); box-shadow:0 0 5px var(--green); }
  .track-state-dot.armed{ background:var(--amber); box-shadow:0 0 5px var(--amber); }

  /* 選択中トラックの色に連動するカード(Track Select / Effects) */
  .synced-card{ border-left:3px solid var(--active-track-color); transition:border-color .15s ease; }
  .synced-card h2{ color:var(--active-track-color); transition:color .15s ease; }

  /* effects */
  .effects-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .fx-cell{ display:flex; flex-direction:column; gap:6px; }
  .fx-toggle{ background:var(--sunk); border:1px solid var(--line); border-radius:var(--radius); padding:12px 4px 8px; cursor:pointer; text-align:center; position:relative; width:100%; }
  .fx-toggle .fx-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin:0 auto 6px; }
  .fx-toggle.on .fx-dot{ background:var(--active-track-color); box-shadow:0 0 6px var(--active-track-color); }
  .fx-toggle.on{ background:var(--sunk); border-color:var(--active-track-color); }
  .fx-toggle.pending{ animation:fxpendingpulse 0.6s ease-in-out infinite; }
  @keyframes fxpendingpulse{ 50%{ box-shadow:0 0 0 2px var(--amber) inset; } }
  .fx-amount{ width:100%; height:14px; accent-color:var(--active-track-color); cursor:pointer; }
  .fx-amount-spacer{ height:14px; }
  .fx-icon{ width:22px; height:22px; margin:0 auto 6px; }
  .fx-icon svg{ width:100%; height:100%; stroke:var(--ink); fill:none; stroke-width:1.6; }
  .fx-label{ font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:0.08em; color:var(--ink-dim); }
  .fx-caption{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.1em; margin-top:var(--gap); }

  /* timeline (Track Selectカードに統合) */
  .timeline-caption{ margin-top:var(--gap); margin-bottom:6px; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-dim); letter-spacing:0.1em; }
  .timeline-wrap{ position:relative; height:90px; background:var(--sunk); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .timeline-wrap canvas{ width:100%; height:100%; display:block; }
  .playhead{ position:absolute; top:0; bottom:0; width:1px; background:var(--red); left:0; }
  .timeline-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.1em; }

  /* midi mappings */
  .mapping-row{ display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:11px; }
  .mapping-row:last-child{ border-bottom:none; }
  .mapping-trigger{ color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:var(--radius); padding:2px 6px; white-space:nowrap; }
  .mapping-arrow{ color:var(--ink-faint); }
  .mapping-action{ flex:1; color:var(--ink-dim); }
  .mapping-remove{ background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; line-height:1; padding:2px 6px; }
  .mapping-empty{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); line-height:1.6; }

  /* 画面下に常時表示するバージョン表示(スクロール位置に関係なく見える) */
  .footer{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:20;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:0.14em;
    color:var(--ink-dim);
    background:rgba(190,194,189,0.92);
    border-top:1px solid var(--line);
    padding:6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    pointer-events:none;  /* 下に隠れたUIの操作を邪魔しない */
  }
</style>
</head>
<body>
<div class="console">
  <div class="brand-row">
    <div>
      <div class="brand">LOOP CONSOLE</div>
      <div class="brand-sub">4-TRACK / MIDI CLOCK SYNC</div>
    </div>
    <div class="brand-right">
      <span class="sync-mode-badge hidden" id="syncModeBadge">EXT</span>
      <button class="panic-btn" id="btnPanic">PANIC</button>
      <button class="learn-toggle" id="btnKeyLearn">KEY LEARN</button>
      <button class="learn-toggle" id="btnMidiLearn">MIDI LEARN</button>
      <button class="fullscreen-btn" id="btnFullscreen">⛶ FULLSCREEN</button>
      <span class="led-mini" id="syncLed"></span>
    </div>
  </div>
  <div class="learn-status hidden" id="learnStatus"></div>

  <div class="hairline"></div>

  <div class="setup" id="setupPanel">
    <label>同期モード</label>
    <div class="mode-toggle" id="syncModeToggle">
      <button data-mode="external" class="active">外部クロック(Circuit等)</button>
      <button data-mode="standalone">スタンドアロン(内部クロック)</button>
    </div>

    <div class="hidden" id="bpmSetupRow">
      <label for="bpmSetupInput">BPM(スタンドアロン時のテンポ)</label>
      <input type="number" id="bpmSetupInput" min="20" max="300" value="120">
    </div>

    <label for="midiSelect" id="midiSelectLabel">MIDI入力(クロックのマスター)</label>
    <select id="midiSelect" disabled><option>権限を許可してください</option></select>

    <label for="audioInSelect">オーディオ入力</label>
    <select id="audioInSelect" disabled><option>権限を許可してください</option></select>
    <label for="inputChannelSelect">入力チャンネル</label>
    <select id="inputChannelSelect">
      <option value="stereo">そのまま(ステレオ)</option>
      <option value="left">L のみ</option>
      <option value="right">R のみ</option>
      <option value="mono">L+R をミックス</option>
    </select>

    <label for="audioOutSelect">オーディオ出力</label>
    <select id="audioOutSelect" disabled><option>権限を許可してください</option></select>
    <div style="height:6px;"></div>
    <button class="btn-slab" id="btnGrant">デバイスへのアクセスを許可</button>
    <button class="btn-slab hidden" id="btnConnect" style="margin-top:10px;">この設定で接続する</button>
    <div class="error hidden" id="errorLine"></div>
  </div>

  <div class="hidden" id="performPanel">
    <div class="main-grid">
      <div class="card">
        <div class="lcd">
          <span class="lcd-time" id="lcdTime">0:00:00</span>
          <span class="lcd-tag" id="lcdTag">READY</span>
        </div>
        <div class="dial-row">
        <div class="dial-wrap">
          <svg class="dial-svg" viewBox="0 0 100 100">
            <circle class="dial-face" cx="50" cy="50" r="46"></circle>
            <line class="dial-cross" x1="50" y1="6" x2="50" y2="14" stroke="var(--line)"></line>
            <line class="dial-cross" x1="50" y1="86" x2="50" y2="94" stroke="var(--line)"></line>
            <g id="dialTicks"></g>
            <circle class="dial-overall-track" cx="50" cy="50" r="34.5"></circle>
            <circle id="dialOverall" class="dial-overall" cx="50" cy="50" r="34.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
            <circle id="dialProgress" class="dial-progress" cx="50" cy="50" r="41" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
          </svg>
          <div class="dial-center">
            <div class="dial-track-label" id="dialTrackLabel">TRACK A</div>
            <div class="dial-bpm" id="bpmNum">---</div>
            <div class="dial-bpm-edit hidden" id="bpmEditWrap">
              <button class="bpm-step" id="bpmDown">−</button>
              <input type="number" id="bpmInput" class="bpm-input" min="20" max="300" value="120">
              <button class="bpm-step" id="bpmUp">+</button>
            </div>
            <div class="dial-bpm-unit">BPM</div>
            <button class="tap-btn hidden" id="btnTap">TAP</button>
            <div class="dial-pos" id="posLabel">BAR – / – ・ BEAT –</div>
          </div>
        </div>
        <div class="metro" id="metroLamps" title="4拍のフラッシュメトロノーム">
          <span class="metro-lamp" data-beat="0"></span>
          <span class="metro-lamp" data-beat="1"></span>
          <span class="metro-lamp" data-beat="2"></span>
          <span class="metro-lamp" data-beat="3"></span>
        </div>
        </div>
        <div class="bars-row" id="barsSelect">
          <button data-bars="1">1</button>
          <button data-bars="2">2</button>
          <button data-bars="4" class="active">4</button>
          <button data-bars="8">8</button>
        </div>
        <div class="bars-caption">LOOP LENGTH (BARS) — SELECTED TRACK</div>
        <div class="state-line" id="stateLine">TRACK A 待機中 — REC で次の小節頭から録音</div>
        <div class="transport">
          <button class="deck-btn" id="btnRec" title="REC"><span class="deck-glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle></svg></span><span class="deck-label">REC</span></button>
          <button class="deck-btn" id="btnPlay" disabled title="PLAY"><span class="deck-glyph"><svg viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"></polygon></svg></span><span class="deck-label">PLAY</span></button>
          <button class="deck-btn" id="btnStop" disabled title="STOP"><span class="deck-glyph"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"></rect></svg></span><span class="deck-label">STOP</span></button>
          <button class="deck-btn" id="btnClear" disabled title="CLEAR"><span class="deck-glyph"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></span><span class="deck-label">CLEAR</span></button>
        </div>
        <div class="tuner" id="tunerPanel">
          <div class="toggle-row">
            <label class="latency-cal" title="拍ごとにクリック音を鳴らします。最初の録音が終わると自動でオフになります">
              <span class="sw-group"><span class="sw-mark sw-mark-off">0</span><span class="sw"><input type="checkbox" id="countToggle"><span class="sw-track"></span><span class="sw-knob"></span></span><span class="sw-mark sw-mark-on">I</span></span>
              カウント
            </label>
            <label class="latency-cal" title="入力の音程を表示します(使用中はごくわずかにCPUを使います)">
              <span class="sw-group"><span class="sw-mark sw-mark-off">0</span><span class="sw"><input type="checkbox" id="tunerToggle"><span class="sw-track"></span><span class="sw-knob"></span></span><span class="sw-mark sw-mark-on">I</span></span>
              チューナー
            </label>
          </div>
          <div class="tuner-readout hidden" id="tunerReadout">
            <div class="tuner-meter"><div class="tuner-needle" id="tunerNeedle"></div></div>
            <div class="tuner-info">
              <span class="tuner-note" id="tunerNote">--</span>
              <span class="tuner-cents" id="tunerCents">--</span>
              <span class="tuner-hz" id="tunerHz"></span>
            </div>
          </div>
        </div>

        <div class="reset-row">
          <button id="btnResetBar">小節頭を今にリセット(手動同期)</button>
          <div class="cal-row">
            <label class="latency-cal" title="録音した音が遅れて聞こえる場合は数値を大きくしてください(入力レイテンシ)">
              録音補正 <input type="number" id="latencyInput" min="0" max="500" step="5" value="0"> ms
            </label>
            <label class="latency-cal" title="ループ再生がクロックより遅れて聞こえる場合は数値を大きくしてください(出力レイテンシ)">
              再生補正 <input type="number" id="playbackInput" min="0" max="300" step="5" value="0"> ms
            </label>
            <label class="latency-cal" title="録音後、しきい値を超えた最初の音が小節頭に来るよう自動でずらします">
              <span class="sw-group"><span class="sw-mark sw-mark-off">0</span><span class="sw"><input type="checkbox" id="autoAdjustToggle"><span class="sw-track"></span><span class="sw-knob"></span></span><span class="sw-mark sw-mark-on">I</span></span>
              オートアジャスト
            </label>
            <label class="latency-cal" title="ループ内のピーク音量に対する割合。小さいほど弱い音にも反応します">
              しきい値 <input type="number" id="autoAdjustThreshold" min="5" max="90" step="5" value="20"> %
            </label>
          </div>
        </div>
      </div>

      <div class="side-col">
      <div class="card synced-card" id="trackPanelCard">
        <h2>TRACKS</h2>
        <div id="trackList"></div>
        <div class="timeline-caption">波形 — <span id="timelineTrackLabel">TRACK A</span></div>
        <div class="timeline-wrap">
          <canvas id="waveCanvas"></canvas>
          <div class="playhead hidden" id="playhead"></div>
          <div class="timeline-empty" id="timelineEmpty">EMPTY</div>
        </div>
      </div>

      <div class="card synced-card" id="fxCard">
      <h2>Effects — <span id="fxTrackLabel">TRACK A</span></h2>
      <div class="effects-grid" id="effectsGrid">
        <div class="fx-cell" data-fx="reverb">
          <button class="fx-toggle"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="11"></circle></svg></div><div class="fx-label">REVERB</div></button>
          <input type="range" class="fx-amount" min="0" max="100" value="50">
        </div>
        <div class="fx-cell" data-fx="delay">
          <button class="fx-toggle"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><path d="M3 12h4M11 12h4M19 12h2"></path></svg></div><div class="fx-label">DELAY</div></button>
          <input type="range" class="fx-amount" min="0" max="100" value="50">
        </div>
        <div class="fx-cell" data-fx="filter">
          <button class="fx-toggle"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.4"></circle></svg></div><div class="fx-label">FILTER</div></button>
          <input type="range" class="fx-amount" min="0" max="100" value="50">
        </div>
        <div class="fx-cell" data-fx="reverse">
          <button class="fx-toggle"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><path d="M4 8l-2 4 2 4M20 8l2 4-2 4" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><div class="fx-label">REVERSE</div></button>
          <div class="fx-amount-spacer"></div>
        </div>
        <div class="fx-cell" data-fx="tape">
          <button class="fx-toggle"><div class="fx-dot"></div><div class="fx-icon"><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4"></circle><circle cx="17" cy="12" r="4"></circle></svg></div><div class="fx-label">TAPE</div></button>
          <input type="range" class="fx-amount" min="0" max="100" value="50">
        </div>
      </div>
        <div class="fx-caption">エフェクトは選択中トラックに個別にかかります</div>
      </div>
      </div>
    </div>

    <div class="lower-grid">
      <div class="card">
        <h2>MIDI Mappings</h2>
        <div id="mappingsList"></div>
        <div style="height:10px;"></div>
        <button class="btn-slab" id="btnClearMappings">すべてのマッピングを解除</button>
      </div>

      <details class="card collapsible" id="keyMappingsCard">
        <summary>Keyboard Mappings</summary>
        <div id="keyMappingsList"></div>
        <div style="height:10px;"></div>
        <button class="btn-slab" id="btnResetKeyMappings">デフォルト配列に戻す</button>
      </details>
    </div>
  </div>

</div>

<div class="footer" id="footerLine">LOOP CONSOLE</div>

<audio id="outputEl" autoplay></audio>

<script>
(() => {
  const APP_VERSION = 'v18';
  // デプロイのたびに APP_VERSION / sw.js の CACHE_NAME と一緒に更新する。
  // UTCで持ち、表示時に閲覧者のローカル時刻へ変換する(時差の誤解を避けるため)
  const APP_BUILT_AT = '2026-08-08T02:41:00Z';
  console.log('[SYNC LOOPER] Script init start. Version:', APP_VERSION);
  window.addEventListener('error', (e) => {
    console.error('[SYNC LOOPER] window error event:', e.message, e.error);
  });
  window.addEventListener('unhandledrejection', (e) => {
    console.error('[SYNC LOOPER] unhandled promise rejection:', e.reason);
  });
  try {
  const els = {
    midiSelect: document.getElementById('midiSelect'),
    midiSelectLabel: document.getElementById('midiSelectLabel'),
    audioInSelect: document.getElementById('audioInSelect'),
    audioOutSelect: document.getElementById('audioOutSelect'),
    btnGrant: document.getElementById('btnGrant'),
    btnConnect: document.getElementById('btnConnect'),
    errorLine: document.getElementById('errorLine'),
    setupPanel: document.getElementById('setupPanel'),
    performPanel: document.getElementById('performPanel'),
    syncLed: document.getElementById('syncLed'),
    syncModeBadge: document.getElementById('syncModeBadge'),
    syncModeToggle: document.getElementById('syncModeToggle'),
    bpmSetupRow: document.getElementById('bpmSetupRow'),
    bpmSetupInput: document.getElementById('bpmSetupInput'),
    lcdTime: document.getElementById('lcdTime'),
    lcdTag: document.getElementById('lcdTag'),
    bpmNum: document.getElementById('bpmNum'),
    bpmEditWrap: document.getElementById('bpmEditWrap'),
    bpmInput: document.getElementById('bpmInput'),
    bpmUp: document.getElementById('bpmUp'),
    bpmDown: document.getElementById('bpmDown'),
    btnTap: document.getElementById('btnTap'),
    posLabel: document.getElementById('posLabel'),
    dialTicks: document.getElementById('dialTicks'),
    dialProgress: document.getElementById('dialProgress'),
    dialOverall: document.getElementById('dialOverall'),
    metroLamps: document.getElementById('metroLamps'),
    dialTrackLabel: document.getElementById('dialTrackLabel'),
    barsSelect: document.getElementById('barsSelect'),
    stateLine: document.getElementById('stateLine'),
    btnRec: document.getElementById('btnRec'),
    btnPlay: document.getElementById('btnPlay'),
    btnStop: document.getElementById('btnStop'),
    btnClear: document.getElementById('btnClear'),
    btnResetBar: document.getElementById('btnResetBar'),
    latencyInput: document.getElementById('latencyInput'),
    playbackInput: document.getElementById('playbackInput'),
    inputChannelSelect: document.getElementById('inputChannelSelect'),
    tunerToggle: document.getElementById('tunerToggle'),
    countToggle: document.getElementById('countToggle'),
    tunerReadout: document.getElementById('tunerReadout'),
    tunerNeedle: document.getElementById('tunerNeedle'),
    tunerNote: document.getElementById('tunerNote'),
    tunerCents: document.getElementById('tunerCents'),
    tunerHz: document.getElementById('tunerHz'),
    autoAdjustToggle: document.getElementById('autoAdjustToggle'),
    autoAdjustThreshold: document.getElementById('autoAdjustThreshold'),
    btnPanic: document.getElementById('btnPanic'),
    btnFullscreen: document.getElementById('btnFullscreen'),
    footerLine: document.getElementById('footerLine'),
    outputEl: document.getElementById('outputEl'),
    trackList: document.getElementById('trackList'),
    effectsGrid: document.getElementById('effectsGrid'),
    fxTrackLabel: document.getElementById('fxTrackLabel'),
    waveCanvas: document.getElementById('waveCanvas'),
    playhead: document.getElementById('playhead'),
    timelineEmpty: document.getElementById('timelineEmpty'),
    timelineTrackLabel: document.getElementById('timelineTrackLabel'),
    btnMidiLearn: document.getElementById('btnMidiLearn'),
    btnKeyLearn: document.getElementById('btnKeyLearn'),
    learnStatus: document.getElementById('learnStatus'),
    mappingsList: document.getElementById('mappingsList'),
    btnClearMappings: document.getElementById('btnClearMappings'),
    keyMappingsList: document.getElementById('keyMappingsList'),
    btnResetKeyMappings: document.getElementById('btnResetKeyMappings'),
    keyMappingsCard: document.getElementById('keyMappingsCard'),
  };

  console.log('[SYNC LOOPER] DOM elements resolved:', els);
  const missingEls = Object.entries(els).filter(([key, val]) => !val).map(([key]) => key);
  if (missingEls.length){
    console.error('[SYNC LOOPER] Missing DOM elements:', missingEls);
    alert('[SYNC LOOPER] 初期化エラー: 以下のIDの要素が見つかりません -> ' + missingEls.join(', '));
  }
  function formatBuiltAt(iso){
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const p = (n) => String(n).padStart(2,'0');

  els.footerLine.textContent = `LOOP CONSOLE — ${APP_VERSION} — 更新 ${formatBuiltAt(APP_BUILT_AT)}`;

  const MAX_CLOCK_CATCHUP_MS = 500;

  const FX_NAMES = ['reverb','delay','filter','reverse','tape'];
  // 「次の小節頭で確定する」予約状態のまとめ(表示・判定で共用)
  const ARMED_STATES = ['rec-armed','play-armed','stop-armed'];

  function escapeHtml(str){

  // デバイス名やMIDI機器名は機器由来の任意文字列なので、innerHTMLで組み立てずDOM APIで流し込む
  function fillSelect(selectEl, options){

  // 剰余を必ず非負にする(小節頭リセットでpulseCountが基準より小さくなり得るため)
  function mod(a, n){ return ((a % n) + n) % n; }

  // ---------- トラック色分け ----------
  const TRACK_COLOR_VARS = { A:'--track-a', B:'--track-b', C:'--track-c', D:'--track-d' };
  function applyActiveTrackColor(id){
    const varName = TRACK_COLOR_VARS[id] || '--amber';
    document.documentElement.style.setProperty('--active-track-color', `var(${varName})`);
    console.log('[SYNC LOOPER] Active track color synced:', id, '->', varName);
  }

  const tracks = ['A','B','C','D'].map(id => ({
    id, bars:4, buffer:null, originalBuffer:null, reversed:false,
    source:null, state:'empty', playStartTime:0,
    recStartFrame:0, recTargetSamples:0, recLatencySamples:0, recPlayTime:0, recPrepTimer:null, recStartPulse:0,
    loopStartPulse:0, recAlignRefId:null, recAlignRefLen:0, recAlignRefStart:0,
    fx:{ reverb:false, delay:false, filter:false, reverse:false, tape:false },
    fxPending:{ reverb:null, delay:null, filter:null, reverse:null, tape:null },
    fxAmount:{ reverb:50, delay:50, filter:50, tape:50 },
    fxChain:null
  }));
  let selectedId = 'A';
  const getSelected = () => tracks.find(t => t.id === selectedId);

  // 録音バッファは全トラック共有のため、録音は同時に1トラックのみ。
  let recordingTrackId = null;

  // ---------- 連続キャプチャ(録音区間をサンプル単位で切り出すため) ----------
  // 以前は「メインスレッドに届いたチャンクの個数」でループ長が決まっていたため、
  // 実測で -41ms〜+4ms のバラつきが出て、周回のたびに小節頭がずれていった。
  // 常時キャプチャしておき、フレーム番号を使って音楽的に正確な長さで切り出す。
  let captureChunks = [];        // { frame, chans:[Float32Array,...] }
  let captureChannels = 0;
  let activeRecStartFrame = 0;
  const PRE_ROLL_SEC = 0.85;
  // 切り出し窓を過去側にずらしておく余裕。ワークレットからのメッセージ到着が遅れても
  // 末尾を取りこぼさず、かつ「締切より前にバッファを用意する」ための猶予にもなる。
  // 後段の回転で相殺されるので音のタイミングには影響しない。
  // 再生補正ぶんまで前倒しで組み立てられるよう、秒で持ってサンプル数に換算する
  const CAPTURE_GUARD_SEC = 0.6;
  let captureGuardSamples = 8192;   // connect() で実際のサンプルレートから設定する
  // バッファ組み立てに要する時間の見込み。締切ちょうどに作り始めると、
  // 確保とコピーにかかる時間ぶん1周目だけ再生が遅れる。
  // 実際の前倒し量は、これに再生補正ぶんを足したもの。
  const PLAY_LEAD_BASE_SEC = 0.09;
  function playLeadSec(){ return PLAY_LEAD_BASE_SEC + playbackOffsetMs / 1000; }

  // 再生レイテンシ補正(ms)。予約した時刻より実際に音が出るのは出力レイテンシぶん
  // 後になるため、その分だけ手前に予約する。値を大きくするほど再生が「前へ」出る。
  // 録音補正(入力レイテンシ)とは補正する対象が違うので、独立した設定にしている。
  let playbackOffsetMs = 0;

  // 録音レイテンシ補正(ms)。値を大きくするほどループが「前へ」ずれる。
  // マイク入力は遅れて届くコピーなので、キャプチャ列のフレームXには実時間
  // (X − 入力レイテンシ)の音が入っている。そのぶん先へ進めて切り出す必要がある。
  let latencyOffsetMs = 0;

  // v9以前は補正の符号が逆(値を上げるほど遅れが増える)だったため、
  // 保存済みの旧値をそのまま引き継がないよう保存キーを変えている
  const LATENCY_STORAGE_KEY = 'syncLooperLatencyMs2';

  function loadLatencyOffset(){
    const raw = localStorage.getItem(LATENCY_STORAGE_KEY);
    if (raw !== null){
      const v = parseFloat(raw);
      if (isFinite(v)) latencyOffsetMs = v;
    }
    els.latencyInput.value = latencyOffsetMs;
  }
  function setLatencyOffset(ms){
    // 負値(=後ろへずらす)は末尾が未キャプチャになるため受け付けない。
    // 入力レイテンシは必ず「録音が遅れる」方向なので0以上で足りる。
    latencyOffsetMs = Math.min(500, Math.max(0, isFinite(ms) ? ms : 0));
    els.latencyInput.value = latencyOffsetMs;
    try{ localStorage.setItem(LATENCY_STORAGE_KEY, String(latencyOffsetMs)); }
    catch(e){ console.error('[SYNC LOOPER] Failed to save latency offset', e); }
    console.log('[SYNC LOOPER] Latency offset set to', latencyOffsetMs, 'ms');
  }
  // 保存値が無ければ実機の入出力レイテンシから初期値を推定する。
  // 録り音の遅れは「入力レイテンシ + 出力レイテンシ」で効いてくる。
  function estimateLatencyOffset(){
    if (localStorage.getItem(LATENCY_STORAGE_KEY) !== null) return;
    let seconds = audioCtx.outputLatency || audioCtx.baseLatency || 0;
    const track = micStream && micStream.getAudioTracks()[0];
    const settings = track && track.getSettings ? track.getSettings() : null;
    if (settings && isFinite(settings.latency)) seconds += settings.latency;
    const ms = Math.round(seconds * 1000 / 5) * 5;
    console.log('[SYNC LOOPER] Estimated round-trip latency:', ms, 'ms (output + input)');
    setLatencyOffset(ms);
  }
  els.latencyInput.addEventListener('change', () => setLatencyOffset(parseFloat(els.latencyInput.value)));
  loadLatencyOffset();

  // ---------- 再生レイテンシ補正 ----------
  const PLAYBACK_STORAGE_KEY = 'syncLooperPlaybackMs';

  function loadPlaybackOffset(){
    const raw = localStorage.getItem(PLAYBACK_STORAGE_KEY);
    if (raw !== null){
      const v = parseFloat(raw);
      if (isFinite(v)) playbackOffsetMs = v;
    }
    els.playbackInput.value = playbackOffsetMs;
  }
  function setPlaybackOffset(ms){
    // 上限は先読み(ガード)で吸収できる範囲まで
    playbackOffsetMs = Math.min(300, Math.max(0, isFinite(ms) ? ms : 0));
    els.playbackInput.value = playbackOffsetMs;
    try{ localStorage.setItem(PLAYBACK_STORAGE_KEY, String(playbackOffsetMs)); }
    catch(e){ console.error('[SYNC LOOPER] Failed to save playback offset', e); }
    console.log('[SYNC LOOPER] Playback offset set to', playbackOffsetMs, 'ms');
  }
  // 保存値が無ければ出力レイテンシから初期値を推定する
  function estimatePlaybackOffset(){
    if (localStorage.getItem(PLAYBACK_STORAGE_KEY) !== null) return;
    const seconds = audioCtx.outputLatency || audioCtx.baseLatency || 0;
    const ms = Math.round(seconds * 1000 / 5) * 5;
    console.log('[SYNC LOOPER] Estimated output latency:', ms, 'ms');
    setPlaybackOffset(ms);
  }
  els.playbackInput.addEventListener('change', () => setPlaybackOffset(parseFloat(els.playbackInput.value)));
  loadPlaybackOffset();

  // ---------- 入力チャンネル選択(保存する) ----------
  try{
    const savedCh = localStorage.getItem('syncLooperInputChannel');
    if (savedCh) els.inputChannelSelect.value = savedCh;
  } catch(e){}
  els.inputChannelSelect.addEventListener('change', () => {

  els.countToggle.addEventListener('change', () => setCountEnabled(els.countToggle.checked));

  // ---------- チューナーの開始/停止 ----------
  els.tunerToggle.addEventListener('change', () => {
    tunerEnabled = els.tunerToggle.checked;

  // ---------- オートアジャスト(しきい値を超えた最初の音を小節頭に合わせる) ----------
  let autoAdjustEnabled = false;
  let autoAdjustThresholdPct = 20;

  function loadAutoAdjust(){
    autoAdjustEnabled = localStorage.getItem('syncLooperAutoAdjust') === '1';
    const raw = parseFloat(localStorage.getItem('syncLooperAutoAdjustPct'));
    if (isFinite(raw)) autoAdjustThresholdPct = Math.min(90, Math.max(5, raw));
    els.autoAdjustToggle.checked = autoAdjustEnabled;
    els.autoAdjustThreshold.value = autoAdjustThresholdPct;
  }
  function saveAutoAdjust(){
    try{
      localStorage.setItem('syncLooperAutoAdjust', autoAdjustEnabled ? '1' : '0');
      localStorage.setItem('syncLooperAutoAdjustPct', String(autoAdjustThresholdPct));
    } catch(e){ console.error('[SYNC LOOPER] Failed to save auto adjust settings', e); }
  }
  els.autoAdjustToggle.addEventListener('change', () => {
    autoAdjustEnabled = els.autoAdjustToggle.checked;
    saveAutoAdjust();
    console.log('[SYNC LOOPER] Auto adjust:', autoAdjustEnabled);
  });
  els.autoAdjustThreshold.addEventListener('change', () => {
    const v = parseFloat(els.autoAdjustThreshold.value);
    autoAdjustThresholdPct = Math.min(90, Math.max(5, isFinite(v) ? v : 20));
    els.autoAdjustThreshold.value = autoAdjustThresholdPct;
    saveAutoAdjust();
    console.log('[SYNC LOOPER] Auto adjust threshold:', autoAdjustThresholdPct, '%');
  });
  loadAutoAdjust();

  // 位置0に最も近い「しきい値を超える点」を探し、0からのサンプル差を返す。
  // 前(末尾に回り込んでいる場合)も探すため戻り値は負にもなる。見つからなければ null。
  // しきい値はループ内のピークに対する相対値なので、入力レベルに依存しない。
  function findOnsetOffset(buffer, thresholdPct, searchSamples, center){
    const n = buffer.length;
    const data = buffer.getChannelData(0);
    let peak = 0;
    for (let i=0;i<n;i++){ const v = Math.abs(data[i]); if (v > peak) peak = v; }
    if (peak <= 0) return null;
    const th = peak * (thresholdPct / 100);
    const limit = Math.min(searchSamples, Math.floor(n/2));
    const c = center || 0;
    for (let d=0; d<=limit; d++){
      if (Math.abs(data[mod(c + d, n)]) >= th) return d;
      if (d > 0 && Math.abs(data[mod(c - d, n)]) >= th) return -d;
    }
    return null;
  }

  // 1パルスあたりの秒数。スタンドアロンは設定値、外部クロックは実測の平均から求める
  function secondsPerPulse(){
    if (syncMode === 'standalone') return 60 / standaloneBpm / PPQ;
    if (clockTimestamps.length >= 2){
      let sum = 0;
      for (let i=1;i<clockTimestamps.length;i++) sum += clockTimestamps[i]-clockTimestamps[i-1];
      return (sum / (clockTimestamps.length-1)) / 1000;
    }
    return 60 / 120 / PPQ;
  }

  // captureChunks から [startFrame, startFrame+numSamples) をサンプル単位で取り出す。
  // 未キャプチャの領域は無音のまま残る(createBufferは0で初期化される)。
  function sliceCapture(startFrame, numSamples){
    if (numSamples <= 0) return null;
    const numChannels = Math.max(1, captureChannels);
    const out = audioCtx.createBuffer(numChannels, numSamples, audioCtx.sampleRate);
    // getChannelData はループの外で1度だけ取得する。
    // チャンクごとに呼ぶと数千回の呼び出しになり、8秒のループで約900msかかって
    // 1周目の再生開始が間に合わなくなっていた。
    const dst = [];
    for (let ch=0; ch<numChannels; ch++) dst.push(out.getChannelData(ch));
    let filled = 0;
    for (const { frame, chans } of captureChunks){
      const len = chans[0].length;
      const from = Math.max(startFrame, frame);
      const to = Math.min(startFrame + numSamples, frame + len);
      if (to <= from) continue;
      const count = to - from;
      const srcOff = from - frame;
      const dstOff = from - startFrame;
      for (let ch=0; ch<numChannels; ch++){
        const src = chans[Math.min(ch, chans.length-1)];
        dst[ch].set(src.subarray(srcOff, srcOff+count), dstOff);
      }
      filled += count;
    }
    return filled > 0 ? out : null;
  }

  // バッファを左へ回転して位相を合わせる。
  // 「切り出し窓を後ろへずらす」のと同じ結果になるが、まだ録れていない未来を
  // 待たずに済む(ループは周期的なので、はみ出した先頭は末尾へ回して問題ない)。
  function rotateBufferLeft(buffer, rotateSamples){
    const n = buffer.length;
    const r = mod(Math.round(rotateSamples), n);
    if (r === 0) return buffer;
    const out = audioCtx.createBuffer(buffer.numberOfChannels, n, buffer.sampleRate);
    for (let ch=0; ch<buffer.numberOfChannels; ch++){
      const src = buffer.getChannelData(ch), dst = out.getChannelData(ch);
      dst.set(src.subarray(r), 0);
      dst.set(src.subarray(0, r), n - r);
    }
    return out;
  }

  // トラック状態 → 表示文言を一元管理(各所に散らばっていた同じ文言の重複を排除)
  function describeTrackState(t){
    switch (t.state){
      case 'playing':    return { line:`TRACK ${t.id} ループ再生中`, tag:'PLAY' };
      case 'stopped':    return { line:`TRACK ${t.id} 停止中 — PLAYで再生 / CLEARで削除`, tag:'STOP' };
      case 'recording':  return { line:`TRACK ${t.id} 録音中 — ${t.bars}小節`, tag:'REC' };
      case 'rec-armed':  return { line: t.recAlignRefId
                                    ? `TRACK ${t.id} 録音待機中 — TRACK ${t.recAlignRefId} の周回頭で開始します`
                                    : `TRACK ${t.id} 録音待機中 — 次の小節頭で開始します`, tag:'ARMED' };
      case 'play-armed': return { line:`TRACK ${t.id} 再生待機中 — 次の小節頭で開始します`, tag:'ARMED' };
      case 'stop-armed': return { line:`TRACK ${t.id} 停止待機中 — 次の小節頭で停止します`, tag:'STOP≈' };
      default:           return { line:`TRACK ${t.id} 待機中 — REC で次の小節頭から録音`, tag:'READY' };
    }
  }
  // 選択中トラックのときだけステータス行とLCDタグを更新する
  function updateStatusLine(t){
    if (t.id !== selectedId) return;
    const { line, tag } = describeTrackState(t);
    els.stateLine.textContent = line;
    els.lcdTag.textContent = tag;
  }
  // パフォーマンス中の警告はsetup画面内のerrorLineに出しても見えないため、ステータス行に出す
  function showTransportMessage(msg){
    els.stateLine.textContent = msg;
    console.log('[SYNC LOOPER] Transport message:', msg);
  }

  // ---------- MIDI mapping state ----------
  let midiLearnActive = false;
  let pendingLearnAction = null;
  let midiMappings = {};

  function loadMappings(){
    try{ midiMappings = JSON.parse(localStorage.getItem('syncLooperMidiMappings') || '{}'); }
    catch(e){ midiMappings = {}; }
    console.log('[SYNC LOOPER] Loaded MIDI mappings:', midiMappings);
  }
  function saveMappings(){
    try{ localStorage.setItem('syncLooperMidiMappings', JSON.stringify(midiMappings)); }
    catch(e){ console.error('[SYNC LOOPER] Failed to save MIDI mappings', e); }
  }
  loadMappings();

  // ---------- Keyboard mapping state ----------
  let keyLearnActive = false;
  let pendingKeyLearnAction = null;
  let keyMappings = {};

  // 縦4列をミキサー風に: 1QAZ=Track A, 2WSX=Track B, 3EDC=Track C, 4RFV=Track D
  // 上段=REC, 2段目=STOP, 3段目=PLAY, 最下段=CLEAR
  const DEFAULT_KEY_MAPPINGS = {
    '1':'transport:rec:A',  'q':'transport:stop:A', 'a':'transport:play:A', 'z':'transport:clear:A',
    '2':'transport:rec:B',  'w':'transport:stop:B', 's':'transport:play:B', 'x':'transport:clear:B',
    '3':'transport:rec:C',  'e':'transport:stop:C', 'd':'transport:play:C', 'c':'transport:clear:C',
    '4':'transport:rec:D',  'r':'transport:stop:D', 'f':'transport:play:D', 'v':'transport:clear:D',
    'Escape':'panic',
  };

  function loadKeyMappings(){
    const raw = localStorage.getItem('syncLooperKeyMappings');
    if (raw === null){
      keyMappings = { ...DEFAULT_KEY_MAPPINGS };
    } else {
      try{ keyMappings = JSON.parse(raw); }
      catch(e){ keyMappings = { ...DEFAULT_KEY_MAPPINGS }; }
      // 既存ユーザー向けマイグレーション: まだどのキーにも割り当てられていないデフォルトアクション(例: panic追加時)を、
      // 既存のキー割り当てを壊さずに補完する
      const mappedActions = new Set(Object.values(keyMappings));
      for (const [k, action] of Object.entries(DEFAULT_KEY_MAPPINGS)){
        if (!mappedActions.has(action) && !(k in keyMappings)){
          keyMappings[k] = action;
        }
      }
    }
    saveKeyMappings();
    console.log('[SYNC LOOPER] Loaded keyboard mappings:', keyMappings);
  }
  function saveKeyMappings(){
    try{ localStorage.setItem('syncLooperKeyMappings', JSON.stringify(keyMappings)); }

  // ---------- dial ticks ----------
  function buildTicks(){
    els.dialTicks.innerHTML = '';
    const bars = getSelected().bars;
    const total = bars * 4;
    for (let i = 0; i < total; i++){
      const angle = (i / total) * 2 * Math.PI;
      const isBarStart = i % 4 === 0;
      const rOuter = 46, rInner = isBarStart ? 43 : 44.5;
      const x1 = 50 + rOuter * Math.cos(angle), y1 = 50 + rOuter * Math.sin(angle);
      const x2 = 50 + rInner * Math.cos(angle), y2 = 50 + rInner * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'tick' + (isBarStart ? ' bar-start' : ''));
      els.dialTicks.appendChild(line);
    }
  }

  // 内側の輪が回り切る単位。バー選択の最大値(8小節)に合わせる
  const MAX_BARS = 8;

  // 録音開始まであと何パルスか(参照トラックがあればその周回頭まで)
  function pulsesUntilRecStart(t){
    if (t.recAlignRefId && t.recAlignRefLen){
      const ref = tracks.find(tr => tr.id === t.recAlignRefId);
      if (ref && ref.state === 'playing'){
        const r = mod(pulseCount - t.recAlignRefStart, t.recAlignRefLen);
        return r === 0 ? 0 : t.recAlignRefLen - r;
      }
    }
    const p = mod(pulseCount, PULSES_PER_BAR);
    return p === 0 ? 0 : PULSES_PER_BAR - p;
  }

  function updateDialProgress(){
    const t = getSelected();
    const total = t.bars * PULSES_PER_BAR;
    // 輪はトラック自身のループ位置を表す。録音・再生は必ず頂点(12時)から始まる。
    let pos;
    if (t.state === 'recording'){
      pos = Math.min(total, pulseCount - t.recStartPulse);
    } else if (t.state === 'playing' || t.state === 'stop-armed'){
      pos = mod(pulseCount - t.loopStartPulse, total);
    } else if (t.state === 'rec-armed'){
      // 録音待機中は「最終小節の頭から終わりまで」を繰り返し、
      // 頂点に到達した瞬間に録音が始まるようにする
      const within = PULSES_PER_BAR - Math.min(PULSES_PER_BAR, pulsesUntilRecStart(t));
      pos = (t.bars - 1) * PULSES_PER_BAR + within;
    } else {
      pos = mod(pulseCount, total);
    }
    const frac = total ? pos / total : 0;
    els.dialProgress.setAttribute('stroke-dashoffset', String(100 - frac * 100));

    // 外周の輪: 最大小節数のうち今どこにいるかを示す
    const overallTotal = MAX_BARS * PULSES_PER_BAR;
    const overallFrac = (mod(pulseCount, overallTotal)) / overallTotal;
    els.dialOverall.setAttribute('stroke-dashoffset', String(100 - overallFrac * 100));
    els.dialProgress.classList.remove('rec','play','armed');
    if (t.state === 'recording') els.dialProgress.classList.add('rec');
    else if (t.state === 'playing') els.dialProgress.classList.add('play');
    else if (ARMED_STATES.includes(t.state)) els.dialProgress.classList.add('armed');

    const barIdx = Math.floor(pos / PULSES_PER_BAR) + 1;
    const beatIdx = Math.floor((pos % PULSES_PER_BAR) / PPQ) + 1;
    els.posLabel.textContent = `BAR ${barIdx}/${t.bars} ・ BEAT ${beatIdx}`;
    els.dialTrackLabel.textContent = `TRACK ${t.id}`;
  }
